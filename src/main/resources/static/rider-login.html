<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Rider Login - FoodDelivery</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://fonts.googleapis.com/css2?family=Anton&family=Inter:wght@300;400;500;600;700&display=swap" rel="stylesheet">
    <style>
        body { font-family: 'Inter', sans-serif; background: #f3f4f6; }
        .bg-dark { background-color: #003F29; }
        .font-anton { font-family: 'Anton', sans-serif; letter-spacing: 1px; text-transform: uppercase; }
        .pattern-bg {
            background-color: #003F29;
            background-image: url("data:image/svg+xml,%3Csvg width='60' height='60' viewBox='0 0 60 60' xmlns='http://www.w3.org/2000/svg'%3E%3Cpath d='M54.627 0l.83.83v58.34h-58.34l-.83-.83L54.627 0zM29.17 0l29.17 29.17V0H29.17zM0 29.17l29.17 29.17H0V29.17z' fill='%23004d33' fill-opacity='0.6' fill-rule='evenodd'/%3E%3C/svg%3E");
        }
    </style>
</head>
<body class="antialiased min-h-screen flex items-center justify-center sm:p-4 bg-gray-100">

    <!-- phone-style container for desktop, full screen on mobile -->
    <div class="w-full h-[100dvh] sm:h-[750px] max-w-[380px] bg-white sm:rounded-[40px] shadow-2xl overflow-hidden relative flex flex-col">
        
        <!-- top dark section -->
        <div class="h-[38%] relative bg-dark flex-shrink-0 flex flex-col justify-center items-center overflow-hidden">
            <div class="absolute inset-0 pattern-bg"></div>
            <!-- logo badge -->
            <div class="relative z-10 w-[90px] h-[90px] bg-white rounded-[28px] shadow-[0_10px_30px_rgba(0,0,0,0.3)] flex items-center justify-center p-3">
                <img src="/img/Zestro logo Green.png" alt="Zestro Logo" class="w-full h-full object-contain">
            </div>
        </div>

        <!-- bottom white section -->
        <div class="flex-1 bg-white relative -mt-10 rounded-tl-[50px] flex flex-col shadow-[0_-10px_20px_rgba(0,0,0,0.1)] z-20 overflow-hidden">
            <div class="flex-1 overflow-y-auto px-8 pt-12 pb-8 flex flex-col">
                <h1 class="text-4xl font-anton text-gray-900 text-center mb-10 shrink-0">Login</h1>

                <!-- error/message box -->
                <div id="message-box" class="hidden mb-6 p-3 rounded-xl text-sm font-medium text-center shrink-0"></div>

                <div id="login-form" class="flex flex-col flex-1 shrink-0">
                <div class="mb-5">
                    <label class="block text-xs font-semibold text-gray-500 mb-1.5 ml-2">Email</label>
                    <input type="text" id="login-username" class="w-full px-5 py-4 rounded-2xl bg-[#f8f9fa] border-none focus:outline-none focus:ring-2 focus:ring-[#003F29] transition text-gray-800 font-medium text-[15px]" placeholder="rider@zestro.com">
                </div>
                <div class="mb-8">
                    <label class="block text-xs font-semibold text-gray-500 mb-1.5 ml-2">Password</label>
                    <input type="password" id="login-password" class="w-full px-5 py-4 rounded-2xl bg-[#f8f9fa] border-none focus:outline-none focus:ring-2 focus:ring-[#003F29] transition text-gray-800 font-bold tracking-widest text-lg" placeholder="••••••••">
                </div>
                
                <div class="mt-auto pt-6">
                    <button onclick="login()" class="w-full text-center bg-[#0b4d26] text-white font-bold py-4 rounded-full text-[17px] hover:bg-[#063017] transition shadow-lg mt-2">
                        Login
                    </button>
                    
                    <div class="text-center mt-8 mb-2">
                        <p class="text-[13px] text-gray-500 font-medium">Don't have any account? <a href="/rider-register.html" class="text-gray-900 font-bold hover:underline">Sign Up</a></p>
                    </div>
                </div>
            </div>
        </div>
    </div>

    <script>
        function showMessage(msg, type) {
            const box = document.getElementById('message-box');
            if (!msg) {
                box.classList.add('hidden');
                return;
            }
            box.classList.remove('hidden', 'bg-red-50', 'text-red-600', 'bg-green-50', 'text-green-600', 'bg-yellow-50', 'text-yellow-700');
            
            if (type === 'error') box.classList.add('bg-red-50', 'text-red-600');
            else if (type === 'success') box.classList.add('bg-green-50', 'text-green-600');
            else if (type === 'warning') box.classList.add('bg-yellow-50', 'text-yellow-700');
            
            box.innerText = msg;
        }

        async function login() {
            const u = document.getElementById('login-username').value;
            const p = document.getElementById('login-password').value;
            if(!u || !p) return showMessage('Please fill all fields', 'error');

            try {
                const res = await fetch('/api/auth/login', {
                    method: 'POST',
                    headers: {'Content-Type': 'application/json'},
                    body: JSON.stringify({username: u, password: p})
                });
                const data = await res.json();

                if (res.ok && data.success) {
                    if (data.user.role !== 'RIDER') {
                        showMessage('Not a rider account', 'error');
                        return;
                    }
                    localStorage.setItem('riderUser', JSON.stringify(data.user));
                    window.location.href = '/rider.html';
                } else if (res.status === 403) {
                    showMessage(data.message, 'warning');
                } else {
                    showMessage(data.message || 'Login failed', 'error');
                }
            } catch (e) {
                showMessage('Network error', 'error');
            }
        }
    </script>
<script src="/auth.js"></script>
</body>
</html>
