<!DOCTYPE html>
<!-- 
  Customer Menu UI
  Fetches and displays live menu items from the Item Management API.
-->
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Menu – Zestro</title>
    <meta name="description" content="Browse our full menu and add your favourite drinks to the cart.">
    <link href="https://fonts.googleapis.com/css2?family=Anton&family=Inter:wght@300;400;500;600;700&display=swap"
        rel="stylesheet">

    <style>
        *,
        *::before,
        *::after {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            -webkit-font-smoothing: antialiased;
        }

        a { text-decoration: none; }

        html, body {
            width: 100%;
            height: 100%;
            overflow: hidden;
            font-family: 'Inter', sans-serif;
            background: #003F29;
        }

        /* BACKGROUND */
        .bg-full {
            position: fixed;
            inset: 0;
            background:
                radial-gradient(ellipse 80% 50% at 50% 105%, #b8e04a 0%, #4db84a 18%, transparent 55%),
                radial-gradient(ellipse at 50% 80%, #1a6645 0%, #003F29 50%, #001d14 100%);
            z-index: 0;
        }

        /* KEYFRAMES */
        @keyframes floatA {
            0%, 100% { transform: translateY(0px) rotate(0deg); }
            50%       { transform: translateY(-18px) rotate(14deg); }
        }
        @keyframes floatB {
            0%, 100% { transform: translateY(0px) rotate(0deg); }
            50%       { transform: translateY(16px) rotate(-12deg); }
        }
        @keyframes floatC {
            0%, 100% { transform: translateY(0px) rotate(0deg); }
            50%       { transform: translateY(-12px) rotate(22deg); }
        }
        @keyframes slideInDown {
            from { opacity: 0; transform: translateY(-22px); }
            to   { opacity: 1; transform: translateY(0); }
        }
        @keyframes fadeInUp {
            from { opacity: 0; transform: translateY(20px); }
            to   { opacity: 1; transform: translateY(0); }
        }
        @keyframes badgePop {
            0%   { transform: scale(1); }
            40%  { transform: scale(1.5); }
            100% { transform: scale(1); }
        }
        @keyframes ripple {
            0%   { box-shadow: 0 0 0 0 rgba(255,255,255,0.5); }
            100% { box-shadow: 0 0 0 22px rgba(255,255,255,0); }
        }
        @keyframes cartFlash {
            0%   { transform: scale(1);   filter: brightness(1); }
            30%  { transform: scale(1.3); filter: brightness(1.8); }
            100% { transform: scale(1);   filter: brightness(1); }
        }
        @keyframes infoFadeIn {
            from { opacity: 0; transform: translateX(-50%) translateY(12px); }
            to   { opacity: 1; transform: translateX(-50%) translateY(0); }
        }

        /* FLOATING BEANS */
        .bean {
            position: fixed;
            pointer-events: none;
            z-index: 2;
            object-fit: contain;
        }
        .b1 { width: 50px;  top: 8%;    left: 4%;    animation: floatA 5.2s ease-in-out infinite;       opacity: .75; filter: blur(1px);   }
        .b2 { width: 44px;  top: 20%;   left: 2%;    animation: floatB 6.8s ease-in-out infinite 1s;    opacity: .55; filter: blur(2px);   }
        .b3 { width: 38px;  bottom: 22%;left: 14%;   animation: floatC 7.0s ease-in-out infinite 1.8s;  opacity: .50; filter: blur(3px);   }
        .b4 { width: 52px;  top: 6%;    right: 4%;   animation: floatC 5.8s ease-in-out infinite .5s;   opacity: .80; filter: blur(1px);   }
        .b5 { width: 68px;  top: 32%;   right: 0%;   animation: floatA 7.0s ease-in-out infinite 1.5s;  opacity: .85; filter: blur(.5px);  }
        .b6 { width: 42px;  bottom: 20%;right: 6%;   animation: floatB 6.2s ease-in-out infinite 2s;    opacity: .65; filter: blur(1.5px); }
        .b7 { width: 36px;  bottom: 8%; right: 28%;  animation: floatC 5.0s ease-in-out infinite .8s;   opacity: .45; filter: blur(2.5px); }
        .b8 { width: 48px;  bottom: 12%;left: 4%;    animation: floatA 6.5s ease-in-out infinite 3s;    opacity: .60; filter: blur(1.5px); }

        /* NAV */
        nav {
            position: fixed;
            top: 0; left: 0; right: 0;
            z-index: 30;
            display: flex;
            align-items: center;
            padding: 24px 60px;
            gap: 16px;
            animation: slideInDown 0.7s ease both 0.1s;
        }
        nav img.logo {
            width: 36px; height: 50px;
            object-fit: contain;
        }
        .nav-links {
            display: flex; gap: 24px;
            font-size: 15px; font-weight: 400;
            margin-left: 16px;
        }
        .nav-links a {
            color: rgba(255,255,255,0.70);
            transition: color 0.2s;
            letter-spacing: 0.3px;
        }
        .nav-links a.active { color: #fff; font-weight: 600; }
        .nav-links a:hover  { color: #fff; }
        .nav-icons {
            margin-left: auto;
            display: flex; gap: 20px; align-items: center;
        }
        .nav-icons button {
            background: none; border: none; cursor: pointer;
            color: rgba(255,255,255,0.85);
            transition: opacity 0.2s, transform 0.2s;
            padding: 0; position: relative;
        }
        .nav-icons button:hover { color: #fff; transform: scale(1.14); }

        /* Cart badge */
        #cart-badge {
            position: absolute;
            top: -6px; right: -6px;
            background: #b8e04a;
            color: #003F29;
            font-size: 10px;
            font-weight: 700;
            width: 18px; height: 18px;
            border-radius: 50%;
            display: flex; align-items: center; justify-content: center;
            opacity: 0;
            transform: scale(0);
            transition: opacity 0.3s, transform 0.3s;
        }
        #cart-badge.visible {
            opacity: 1;
            transform: scale(1);
        }
        #cart-badge.pop {
            animation: badgePop 0.4s ease;
        }

        /* CAROUSEL STAGE */
        #carousel-area {
            position: fixed;
            top: 78px;
            left: 0; right: 0;
            height: 62vh;
            display: flex;
            align-items: center;
            justify-content: center;
            z-index: 10;
        }

        #drink-stage {
            position: relative;
            width: 100%;
            height: 100%;
            display: flex;
            align-items: center;
            justify-content: center;
        }

        /* Individual drink cards */
        .drink-card {
            position: absolute;
            display: flex;
            align-items: center;
            justify-content: center;
            transition:
                transform 0.65s cubic-bezier(0.34, 1.15, 0.64, 1),
                opacity   0.60s ease,
                filter    0.60s ease;
            cursor: pointer;
            user-select: none;
        }
        .drink-card img {
            width: 360px;
            height: auto;
            object-fit: contain;
            filter: drop-shadow(0 28px 60px rgba(0,0,0,0.60));
            pointer-events: none;
            display: block;
        }

        /* Position classes */
        .drink-card.pos-center {
            transform: translateX(0) scale(1.15);
            opacity: 1;
            filter: none;
            z-index: 10;
            cursor: default;
        }
        .drink-card.pos-left {
            transform: translateX(clamp(-400px, -30vw, -260px)) scale(0.58);
            opacity: 0.75;
            filter: brightness(0.65);
            z-index: 5;
        }
        .drink-card.pos-right {
            transform: translateX(clamp(260px, 30vw, 400px)) scale(0.58);
            opacity: 0.75;
            filter: brightness(0.65);
            z-index: 5;
        }
        .drink-card.pos-far-left {
            transform: translateX(-550px) scale(0.35);
            opacity: 0;
            z-index: 1;
            pointer-events: none;
        }
        .drink-card.pos-far-right {
            transform: translateX(550px) scale(0.35);
            opacity: 0;
            z-index: 1;
            pointer-events: none;
        }
        .drink-card.pos-hidden {
            opacity: 0;
            z-index: 0;
            pointer-events: none;
        }

        /* Nav Arrows */
        .arrow-btn {
            position: fixed;
            top: 50%;
            transform: translateY(-50%);
            z-index: 20;
            width: 46px; height: 46px;
            border-radius: 50%;
            background: #2a7a50;
            border: none;
            cursor: pointer;
            display: flex; align-items: center; justify-content: center;
            color: #fff;
            box-shadow: 0 4px 20px rgba(0,0,0,0.35);
            transition: background 0.2s, transform 0.2s, box-shadow 0.2s;
            animation: fadeInUp 0.8s ease both 0.4s;
        }
        .arrow-btn:hover {
            background: #35a066;
            transform: translateY(-50%) scale(1.1);
            box-shadow: 0 8px 30px rgba(0,0,0,0.4);
        }
        .arrow-btn:active { transform: translateY(-50%) scale(0.95); }
        #prev-btn { left: 24px; }
        #next-btn { right: 24px; }

        /* INFO PANEL */
        #info-panel {
            position: fixed;
            left: 50%;
            transform: translateX(-50%);
            bottom: 8%;
            text-align: center;
            z-index: 20;
            display: flex;
            flex-direction: column;
            align-items: center;
            gap: 10px;
            min-width: 260px;
        }

        #drink-name-display {
            font-family: 'Anton', sans-serif;
            font-size: clamp(32px, 4.5vw, 58px);
            font-weight: 400;
            color: #C8A86A;
            letter-spacing: 1px;
            line-height: 1;
            transition: opacity 0.35s ease, transform 0.35s ease;
        }

        #drink-desc-display {
            font-family: 'Inter', sans-serif;
            font-size: clamp(12px, 1.1vw, 14px);
            font-weight: 400;
            color: rgba(255, 255, 255, 0.60);
            line-height: 1.55;
            max-width: 320px;
            text-align: center;
            transition: opacity 0.35s ease, transform 0.35s ease;
        }

        /* Custom Size Dropdown */
        #size-selector {
            position: relative;
            display: inline-block;
        }

        #size-trigger {
            display: flex;
            align-items: center;
            gap: 8px;
            background: rgba(255,255,255,0.10);
            border: 1.5px solid rgba(255,255,255,0.20);
            border-radius: 100px;
            padding: 7px 16px 7px 18px;
            color: rgba(255,255,255,0.85);
            font-family: 'Inter', sans-serif;
            font-size: 14px;
            font-weight: 500;
            cursor: pointer;
            user-select: none;
            transition: background 0.2s, border-color 0.2s;
            white-space: nowrap;
            backdrop-filter: blur(6px);
        }
        #size-trigger:hover {
            background: rgba(255,255,255,0.17);
            border-color: rgba(255,255,255,0.35);
            color: #fff;
        }
        #size-trigger.open {
            background: rgba(255,255,255,0.18);
            border-color: rgba(255,255,255,0.40);
            color: #fff;
        }
        .trigger-chevron {
            display: flex;
            align-items: center;
            transition: transform 0.3s cubic-bezier(0.34,1.2,0.64,1);
        }
        #size-trigger.open .trigger-chevron {
            transform: rotate(180deg);
        }

        #size-dropdown-list {
            position: absolute;
            bottom: calc(100% + 8px);
            left: 50%;
            transform: translateX(-50%) scaleY(0.85);
            transform-origin: bottom center;
            min-width: 130px;
            background: rgba(0, 45, 28, 0.92);
            border: 1.5px solid rgba(255,255,255,0.15);
            border-radius: 16px;
            overflow: hidden;
            backdrop-filter: blur(16px);
            box-shadow: 0 8px 32px rgba(0,0,0,0.45);
            opacity: 0;
            pointer-events: none;
            transition: opacity 0.25s ease, transform 0.3s cubic-bezier(0.34,1.2,0.64,1);
            z-index: 50;
        }
        #size-dropdown-list.open {
            opacity: 1;
            pointer-events: all;
            transform: translateX(-50%) scaleY(1);
        }
        .size-option {
            padding: 11px 20px;
            font-family: 'Inter', sans-serif;
            font-size: 14px;
            font-weight: 500;
            color: rgba(255,255,255,0.75);
            cursor: pointer;
            transition: background 0.18s, color 0.18s;
            text-align: center;
        }
        .size-option:not(:last-child) {
            border-bottom: 1px solid rgba(255,255,255,0.08);
        }
        .size-option:hover {
            background: rgba(255,255,255,0.10);
            color: #fff;
        }
        .size-option.selected {
            color: #b8e04a;
            font-weight: 600;
        }

        #drink-price-display {
            font-family: 'Inter', sans-serif;
            font-size: clamp(18px, 2.5vw, 26px);
            font-weight: 600;
            color: #fff;
            transition: opacity 0.35s ease;
        }

        #add-to-cart-btn {
            margin-top: 4px;
            background: #fff;
            color: #003F29;
            font-family: 'Anton', sans-serif;
            font-size: clamp(14px, 1.5vw, 17px);
            letter-spacing: 1px;
            border: none;
            padding: 14px 44px;
            border-radius: 100px;
            cursor: pointer;
            transition: transform 0.22s, box-shadow 0.22s, background 0.22s;
            box-shadow: 0 6px 24px rgba(0,0,0,0.25);
            white-space: nowrap;
        }
        #add-to-cart-btn:hover {
            transform: scale(1.05);
            box-shadow: 0 10px 36px rgba(0,0,0,0.35);
        }
        #add-to-cart-btn:active { transform: scale(0.97); }
        #add-to-cart-btn.added {
            background: #b8e04a;
            color: #003F29;
        }

        /* info change animation helpers */
        .info-fade-out {
            opacity: 0 !important;
            transform: translateY(-8px) !important;
        }
        .info-fade-in {
            animation: infoFadeIn 0.4s ease both;
        }

        /* FLYING CART ELEMENT */
        .fly-to-cart {
            position: fixed;
            z-index: 999;
            pointer-events: none;
            border-radius: 50%;
            object-fit: contain;
            will-change: transform, opacity;
        }

        /* BACKGROUND DRINK NAME */
        #bg-drink-name {
            position: fixed;
            left: 50%;
            top: 10vh;
            transform: translateX(-50%);
            font-family: 'Anton', sans-serif;
            font-size: clamp(72px, 13vw, 170px);
            font-weight: 400;
            color: transparent;
            -webkit-text-stroke: 2px rgba(200, 168, 106, 0.55);
            text-stroke: 2px rgba(200, 168, 106, 0.55);
            white-space: nowrap;
            letter-spacing: 3px;
            text-transform: capitalize;
            z-index: 3;   /* above beans(2), below carousel(10) */
            pointer-events: none;
            transition: opacity 0.35s ease, transform 0.35s ease;
            user-select: none;
        }

        #bg-drink-name.bg-fade-out {
            opacity: 0;
            transform: translateX(-50%) translateY(-10px);
        }
    </style>
    <link rel="stylesheet" href="/modern-animations.css">
    <link rel="stylesheet" href="/spa-transitions.css">
</head>

<body>
    <div id="page-container">


    <!-- background -->
    <div class="bg-full"></div>

    <!-- floating beans -->
    <img src="/img/bean.png?v=4" class="bean b1" alt="">
    <img src="/img/bean.png?v=4" class="bean b2" alt="">
    <img src="/img/bean.png?v=4" class="bean b3" alt="">
    <img src="/img/bean.png?v=4" class="bean b4" alt="">
    <img src="/img/bean.png?v=4" class="bean b5" alt="">
    <img src="/img/bean.png?v=4" class="bean b6" alt="">
    <img src="/img/bean.png?v=4" class="bean b7" alt="">
    <img src="/img/bean.png?v=4" class="bean b8" alt="">

    <!-- navbar -->
    <nav>
        <a href="/index.html">
            <img src="/img/zestro-logo-white.png" class="logo" alt="Zestro Logo">
        </a>
        <div class="nav-links">
            <a href="/index.html">Home</a>
            <a href="#" class="active">Shop</a>
            <a href="#">Contact</a>
        </div>
        <div class="nav-icons">
            <button id="account-btn" aria-label="Account">
                <svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6"
                    stroke-linecap="round" stroke-linejoin="round">
                    <path d="M19 21v-2a4 4 0 0 0-4-4H9a4 4 0 0 0-4 4v2" />
                    <circle cx="12" cy="7" r="4" />
                </svg>
            </button>
            <button id="cart-btn" aria-label="Cart">
                <svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6"
                    stroke-linecap="round" stroke-linejoin="round">
                    <path d="M6 2 3 6v14a2 2 0 0 0 2 2h14a2 2 0 0 0 2-2V6l-3-4Z" />
                    <path d="M3 6h18" />
                    <path d="M16 10a4 4 0 0 1-8 0" />
                </svg>
                <span id="cart-badge">0</span>
            </button>
        </div>
    </nav>

    <!-- arrow buttons -->
    <button class="arrow-btn" id="prev-btn" aria-label="Previous drink">
        <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5"
            stroke-linecap="round" stroke-linejoin="round">
            <polyline points="15 18 9 12 15 6" />
        </svg>
    </button>
    <button class="arrow-btn" id="next-btn" aria-label="Next drink">
        <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5"
            stroke-linecap="round" stroke-linejoin="round">
            <polyline points="9 18 15 12 9 6" />
        </svg>
    </button>

    <!-- background drink name (large outlined text behind carousel) -->
    <div id="bg-drink-name"></div>

    <!-- carousel -->
    <div id="carousel-area">
        <div id="drink-stage">
            <!-- cards injected by js -->
        </div>
    </div>

    <!-- info panel -->
    <div id="info-panel">
        <div id="drink-name-display"></div>
        <div id="drink-desc-display"></div>
        <div id="size-selector">
            <div id="size-trigger">
                <span id="size-label">Medium</span>
                <span class="trigger-chevron">
                    <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor"
                        stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round">
                        <polyline points="6 9 12 15 18 9"/>
                    </svg>
                </span>
            </div>
            <div id="size-dropdown-list">
                <div class="size-option" data-value="Small">Small</div>
                <div class="size-option selected" data-value="Medium">Medium</div>
                <div class="size-option" data-value="Large">Large</div>
            </div>
        </div>
        <div id="drink-price-display"></div>
        <button id="add-to-cart-btn" onclick="addToCart()">ADD TO CART</button>
    </div>

    <script>
        /* DRINK DATA */
        let drinks = [];

        let current = 0;
        let transitioning = false;
        let cartCount = 0;

        const stage = document.getElementById('drink-stage');
        const nameEl = document.getElementById('drink-name-display');
        const priceEl = document.getElementById('drink-price-display');
        const badge = document.getElementById('cart-badge');
        const cartBtn = document.getElementById('cart-btn');

        /* Active size tracked as a variable (custom dropdown) */
        let currentSize = 'Medium';

        /* BUILD CARDS */
        let cards = [];
        
        async function initMenu() {
            try {
                const res = await fetch('/api/menu');
                const data = await res.json();
                
                if (data.length === 0) {
                    document.getElementById('drink-name-display').innerHTML = "Menu is empty";
                    return;
                }

                // map db format to ui format
                drinks = data.map(item => ({
                    name: item.name,
                    image: item.imageUrl || '/img/drink-1.png',
                    desc: item.description,
                    // dynamically map single db price to sizes
                    price: {
                        Small: Math.max(1, item.price - 1.00),
                        Medium: item.price,
                        Large: item.price + 1.50
                    }
                }));

                cards = drinks.map((d, i) => {
                    const el = document.createElement('div');
                    el.className = 'drink-card';
                    el.dataset.idx = i;
                    const img = document.createElement('img');
                    img.src = d.image;
                    img.alt = d.name;
                    el.appendChild(img);
                    stage.appendChild(el);

                    // side cards are clickable to navigate
                    el.addEventListener('click', () => {
                        const pos = getRelPos(parseInt(el.dataset.idx));
                        if (pos === -1) navigate(-1);
                        else if (pos === 1) navigate(1);
                    });

                    return el;
                });

                renderPositions();
                updateInfo(false);
            } catch (err) {
                console.error("Failed to load menu", err);
            }
        }

        /* POSITIONING */
        function getRelPos(idx) {
            let rel = (idx - current + drinks.length) % drinks.length;
            if (rel > drinks.length / 2) rel -= drinks.length;
            return rel; // -2, -1, 0, 1, 2 
        }

        function posClass(rel) {
            if (rel === 0)  return 'pos-center';
            if (rel === -1) return 'pos-left';
            if (rel === 1)  return 'pos-right';
            if (rel <= -2)  return 'pos-far-left';
            if (rel >= 2)   return 'pos-far-right';
            return 'pos-hidden';
        }

        function renderPositions() {
            cards.forEach((card, i) => {
                const rel = getRelPos(i);
                card.className = `drink-card ${posClass(rel)}`;
            });
        }

        /* INFO PANEL UPDATE */
        const bgNameEl = document.getElementById('bg-drink-name');
        const descEl   = document.getElementById('drink-desc-display');

        function updateInfo(animate = true) {
            const d = drinks[current];
            const size = currentSize;

            if (animate) {
                // fade out info + bg name
                nameEl.classList.add('info-fade-out');
                descEl.classList.add('info-fade-out');
                priceEl.classList.add('info-fade-out');
                bgNameEl.classList.add('bg-fade-out');

                setTimeout(() => {
                    nameEl.textContent  = d.name;
                    descEl.textContent  = d.desc;
                    priceEl.textContent = `$${d.price[size].toFixed(2)}`;
                    bgNameEl.textContent = d.name;
                    nameEl.classList.remove('info-fade-out');
                    descEl.classList.remove('info-fade-out');
                    priceEl.classList.remove('info-fade-out');
                    bgNameEl.classList.remove('bg-fade-out');
                }, 300);
            } else {
                nameEl.textContent  = d.name;
                descEl.textContent  = d.desc;
                priceEl.textContent = `$${d.price[size].toFixed(2)}`;
                bgNameEl.textContent = d.name;
                
                // re-trigger the modern text reveal animation now that text is loaded
                requestAnimationFrame(() => {
                    [nameEl, descEl, priceEl, bgNameEl].forEach(el => {
                        el.style.transition = 'none';
                        el.classList.remove('active');
                    });
                    
                    requestAnimationFrame(() => {
                        [nameEl, descEl, priceEl, bgNameEl].forEach(el => {
                            el.style.transition = '';
                            el.classList.add('active');
                        });
                    });
                });
            }
        }

        /* NAVIGATE */
        function navigate(dir) {
            if (transitioning) return;
            transitioning = true;

            current = (current + dir + drinks.length) % drinks.length;
            renderPositions();
            updateInfo(true);

            // reset add-to-cart btn
            const btn = document.getElementById('add-to-cart-btn');
            btn.textContent = 'ADD TO CART';
            btn.classList.remove('added');

            setTimeout(() => { transitioning = false; }, 700);
        }

        /* ADD TO CART */
        function addToCart() {
            const btn = document.getElementById('add-to-cart-btn');
            if (btn.dataset.animating === 'true') return;
            btn.dataset.animating = 'true';

            // ripple on button
            btn.style.animation = 'ripple 0.5s ease';
            setTimeout(() => { btn.style.animation = ''; }, 500);

            // flying drink clone
            const centerCard = document.querySelector('.drink-card.pos-center img');
            const cartIcon = document.getElementById('cart-btn');
            const drinkRect = centerCard.getBoundingClientRect();
            const cartRect = cartIcon.getBoundingClientRect();

            const fly = document.createElement('img');
            fly.src = centerCard.src;
            fly.className = 'fly-to-cart';

            const startSize = 90;
            const endSize = 22;

            Object.assign(fly.style, {
                width:     `${startSize}px`,
                height:    `${startSize}px`,
                left:      `${drinkRect.left + drinkRect.width / 2 - startSize / 2}px`,
                top:       `${drinkRect.top  + drinkRect.height / 2 - startSize / 2}px`,
                opacity:   '1',
                transition: 'left 0.75s cubic-bezier(0.34, 1.1, 0.64, 1), top 0.75s cubic-bezier(0.34, 1.1, 0.64, 1), width 0.75s ease, height 0.75s ease, opacity 0.6s ease',
            });
            document.body.appendChild(fly);

            // animate to cart
            requestAnimationFrame(() => requestAnimationFrame(() => {
                Object.assign(fly.style, {
                    left:    `${cartRect.left + cartRect.width / 2 - endSize / 2}px`,
                    top:     `${cartRect.top  + cartRect.height / 2 - endSize / 2}px`,
                    width:   `${endSize}px`,
                    height:  `${endSize}px`,
                    opacity: '0.15',
                });
            }));

            // cleanup + badge
            setTimeout(() => {
                fly.remove();

                // ── persist to localstorage ──
                const d = drinks[current];
                const stored = JSON.parse(localStorage.getItem('coffeeCart') || '[]');
                const existing = stored.findIndex(i => i.name === d.name && i.size === currentSize);
                if (existing >= 0) {
                    stored[existing].qty++;
                } else {
                    stored.push({ name: d.name, image: d.image, size: currentSize, price: d.price[currentSize], qty: 1 });
                }
                localStorage.setItem('coffeeCart', JSON.stringify(stored));

                cartCount = stored.reduce((s, i) => s + i.qty, 0);
                badge.textContent = cartCount;
                badge.classList.add('visible');
                badge.classList.add('pop');
                cartIcon.style.animation = 'cartFlash 0.45s ease';

                setTimeout(() => {
                    badge.classList.remove('pop');
                    cartIcon.style.animation = '';
                }, 450);

                // button feedback
                btn.textContent = '✓ Added!';
                btn.classList.add('added');
                setTimeout(() => {
                    btn.textContent = 'ADD TO CART';
                    btn.classList.remove('added');
                    btn.dataset.animating = 'false';
                }, 1600);

            }, 700);
        }

        /* CUSTOM SIZE DROPDOWN */
        const sizeTrigger  = document.getElementById('size-trigger');
        const sizeList     = document.getElementById('size-dropdown-list');
        const sizeLabel    = document.getElementById('size-label');
        const sizeOptions  = document.querySelectorAll('.size-option');

        function openDropdown() {
            sizeTrigger.classList.add('open');
            sizeList.classList.add('open');
        }
        function closeDropdown() {
            sizeTrigger.classList.remove('open');
            sizeList.classList.remove('open');
        }

        sizeTrigger.addEventListener('click', e => {
            e.stopPropagation();
            sizeList.classList.contains('open') ? closeDropdown() : openDropdown();
        });

        sizeOptions.forEach(opt => {
            opt.addEventListener('click', () => {
                currentSize = opt.dataset.value;
                sizeLabel.textContent = currentSize;
                sizeOptions.forEach(o => o.classList.remove('selected'));
                opt.classList.add('selected');
                closeDropdown();
                updateInfo(false);   // update price without full fade
            });
        });

        // close when clicking outside
        document.addEventListener('click', () => closeDropdown());
        sizeList.addEventListener('click', e => e.stopPropagation());

        /* ARROW BUTTONS + KEYBOARD */
        document.getElementById('prev-btn').addEventListener('click', () => navigate(-1));
        document.getElementById('next-btn').addEventListener('click', () => navigate(1));

        document.addEventListener('keydown', e => {
            if (e.key === 'ArrowLeft')  navigate(-1);
            if (e.key === 'ArrowRight') navigate(1);
        });

        /* Swipe support */
        let touchStartX = 0;
        document.addEventListener('touchstart', e => { touchStartX = e.touches[0].clientX; });
        document.addEventListener('touchend',   e => {
            const dx = e.changedTouches[0].clientX - touchStartX;
            if (Math.abs(dx) > 50) navigate(dx < 0 ? 1 : -1);
        });

        // cart btn navigates to cart page
        document.getElementById('cart-btn').addEventListener('click', () => {
            window.location.href = '/cart.html';
        });

        /* INIT */
        // restore badge from localstorage
        const _stored = JSON.parse(localStorage.getItem('coffeeCart') || '[]');
        cartCount = _stored.reduce((s, i) => s + i.qty, 0);
        if (cartCount > 0) {
            badge.textContent = cartCount;
            badge.classList.add('visible');
        }

        initMenu();
    </script>

    </div>
    <script src="/modern-animations.js"></script>
<script src="/auth.js"></script>
    <script src="/spa-router.js"></script>
</body>
</html>
