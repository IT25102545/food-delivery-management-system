<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Cart – Zestro</title>
    <link href="https://fonts.googleapis.com/css2?family=Anton&family=Inter:wght@300;400;500;600;700&display=swap"
        rel="stylesheet">
    <style>
        *,
        *::before,
        *::after {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            -webkit-font-smoothing: antialiased;
        }

        a {
            text-decoration: none;
        }

        html,
        body {
            width: 100%;
            height: 100%;
            overflow: hidden;
            font-family: 'Inter', sans-serif;
            background: #003F29;
        }

        /* Background */
        .bg-full {
            position: fixed;
            inset: 0;
            background:
                radial-gradient(ellipse 80% 50% at 50% 105%, #b8e04a 0%, #4db84a 18%, transparent 55%),
                radial-gradient(ellipse at 50% 80%, #1a6645 0%, #003F29 50%, #001d14 100%);
            z-index: 0;
        }

        /* Animations */
        @keyframes floatA {

            0%,
            100% {
                transform: translateY(0) rotate(0deg)
            }

            50% {
                transform: translateY(-18px) rotate(14deg)
            }
        }

        @keyframes floatB {

            0%,
            100% {
                transform: translateY(0) rotate(0deg)
            }

            50% {
                transform: translateY(16px) rotate(-12deg)
            }
        }

        @keyframes floatC {

            0%,
            100% {
                transform: translateY(0) rotate(0deg)
            }

            50% {
                transform: translateY(-12px) rotate(22deg)
            }
        }

        @keyframes slideDown {
            from {
                opacity: 0;
                transform: translateY(-18px)
            }

            to {
                opacity: 1;
                transform: translateY(0)
            }
        }

        @keyframes fadeUp {
            from {
                opacity: 0;
                transform: translateY(20px)
            }

            to {
                opacity: 1;
                transform: translateY(0)
            }
        }

        @keyframes rowOut {
            to {
                opacity: 0;
                transform: translateX(60px) scale(0.95)
            }
        }

        /* Beans */
        .bean {
            position: fixed;
            pointer-events: none;
            z-index: 2;
            object-fit: contain;
        }

        .b1 {
            width: 50px;
            top: 8%;
            left: 4%;
            animation: floatA 5.2s ease-in-out infinite;
            opacity: .70;
            filter: blur(1px)
        }

        .b2 {
            width: 44px;
            top: 22%;
            left: 1%;
            animation: floatB 6.8s ease-in-out infinite 1s;
            opacity: .50;
            filter: blur(2px)
        }

        .b3 {
            width: 38px;
            bottom: 20%;
            left: 12%;
            animation: floatC 7s ease-in-out infinite 1.8s;
            opacity: .45;
            filter: blur(3px)
        }

        .b4 {
            width: 52px;
            top: 6%;
            right: 4%;
            animation: floatC 5.8s ease-in-out infinite .5s;
            opacity: .75;
            filter: blur(1px)
        }

        .b5 {
            width: 66px;
            top: 30%;
            right: 0%;
            animation: floatA 7s ease-in-out infinite 1.5s;
            opacity: .80;
            filter: blur(.5px)
        }

        .b6 {
            width: 40px;
            bottom: 18%;
            right: 5%;
            animation: floatB 6.2s ease-in-out infinite 2s;
            opacity: .60;
            filter: blur(1.5px)
        }

        .b7 {
            width: 36px;
            bottom: 6%;
            right: 26%;
            animation: floatC 5s ease-in-out infinite .8s;
            opacity: .45;
            filter: blur(2px)
        }

        .b8 {
            width: 46px;
            bottom: 10%;
            left: 4%;
            animation: floatA 6.5s ease-in-out infinite 3s;
            opacity: .55;
            filter: blur(1.5px)
        }

        /* Navbar */
        nav {
            position: fixed;
            top: 0;
            left: 0;
            right: 0;
            z-index: 30;
            display: flex;
            align-items: center;
            padding: 22px 60px;
            gap: 16px;
            animation: slideDown 0.7s ease both 0.1s;
        }

        nav img.logo {
            width: 36px;
            height: 50px;
            object-fit: contain;
        }

        .nav-links {
            display: flex;
            gap: 24px;
            font-size: 15px;
            margin-left: 16px;
        }

        .nav-links a {
            color: rgba(255, 255, 255, .70);
            transition: color .2s;
            letter-spacing: .3px;
        }

        .nav-links a:hover {
            color: #fff;
        }

        .nav-icons {
            margin-left: auto;
            display: flex;
            gap: 20px;
            align-items: center;
        }

        .nav-icons button {
            background: none;
            border: none;
            cursor: pointer;
            color: rgba(255, 255, 255, .85);
            transition: transform .2s;
            padding: 0;
        }

        .nav-icons button:hover {
            color: #fff;
            transform: scale(1.14);
        }

        /* Scroll area */
        #page {
            position: fixed;
            top: 80px;
            left: 0;
            right: 0;
            bottom: 0;
            overflow-y: auto;
            z-index: 10;
            padding: 32px 48px 48px;
        }

        #page::-webkit-scrollbar {
            width: 6px;
        }

        #page::-webkit-scrollbar-track {
            background: transparent;
        }

        #page::-webkit-scrollbar-thumb {
            background: rgba(255, 255, 255, .2);
            border-radius: 3px;
        }

        /* Page title */
        #page-title {
            font-family: 'Anton', sans-serif;
            font-size: clamp(32px, 4vw, 52px);
            color: #fff;
            letter-spacing: 1px;
            margin-bottom: 28px;
            animation: fadeUp .7s ease both .15s;
        }

        /* Two-column layout */
        #layout {
            display: flex;
            gap: 24px;
            align-items: flex-start;
        }

        #cart-panel {
            flex: 1;
            min-width: 0;
            animation: fadeUp .7s ease both .2s;
        }

        #summary-panel {
            width: 300px;
            flex-shrink: 0;
            animation: fadeUp .7s ease both .3s;
        }

        /* Glass card */
        .glass {
            background: rgba(0, 30, 18, .60);
            border: 1px solid rgba(255, 255, 255, .10);
            border-radius: 20px;
            backdrop-filter: blur(18px);
            -webkit-backdrop-filter: blur(18px);
            padding: 24px;
        }

        /* Cart table header */
        .cart-header {
            display: grid;
            grid-template-columns: 1fr 160px 100px 48px;
            gap: 12px;
            padding: 0 8px 14px;
            border-bottom: 1px solid rgba(255, 255, 255, .08);
            color: rgba(255, 255, 255, .45);
            font-size: 13px;
            font-weight: 400;
            text-transform: uppercase;
            letter-spacing: .8px;
        }

        .cart-header .col-qty,
        .cart-header .col-total,
        .cart-header .col-action {
            text-align: center;
        }

        /* Cart item row */
        .cart-item {
            display: grid;
            grid-template-columns: 1fr 160px 100px 48px;
            gap: 12px;
            align-items: center;
            padding: 16px 8px;
            border-bottom: 1px solid rgba(255, 255, 255, .06);
            transition: opacity .35s ease, transform .35s ease;
        }

        .cart-item:last-child {
            border-bottom: none;
        }

        /* product col */
        .product-col {
            display: flex;
            align-items: center;
            gap: 14px;
        }

        .product-col img {
            width: 70px;
            height: 70px;
            border-radius: 14px;
            object-fit: contain;
            background: rgba(255, 255, 255, .06);
            filter: drop-shadow(0 6px 16px rgba(0, 0, 0, .4));
            flex-shrink: 0;
        }

        .product-info .item-name {
            font-family: 'Anton', sans-serif;
            font-size: 18px;
            color: #C8A86A;
            letter-spacing: .5px;
        }

        .product-info .item-sub {
            font-size: 13px;
            color: rgba(255, 255, 255, .50);
            margin-top: 2px;
        }

        /* qty col */
        .qty-col {
            display: flex;
            align-items: center;
            justify-content: center;
        }

        .qty-ctrl {
            display: flex;
            align-items: center;
            gap: 0;
            background: rgba(255, 255, 255, .08);
            border: 1.5px solid rgba(255, 255, 255, .15);
            border-radius: 100px;
            overflow: hidden;
        }

        .qty-btn {
            width: 34px;
            height: 34px;
            background: none;
            border: none;
            color: rgba(255, 255, 255, .80);
            font-size: 18px;
            cursor: pointer;
            display: flex;
            align-items: center;
            justify-content: center;
            transition: background .18s, color .18s;
        }

        .qty-btn:hover {
            background: rgba(255, 255, 255, .12);
            color: #fff;
        }

        .qty-val {
            min-width: 32px;
            text-align: center;
            font-size: 15px;
            font-weight: 600;
            color: #fff;
        }

        /* total col */
        .total-col {
            text-align: center;
            font-size: 16px;
            font-weight: 700;
            color: #fff;
        }

        /* action col */
        .action-col {
            display: flex;
            justify-content: center;
        }

        .del-btn {
            background: none;
            border: none;
            cursor: pointer;
            color: rgba(255, 100, 100, .70);
            transition: color .2s, transform .2s;
            padding: 6px;
        }

        .del-btn:hover {
            color: #ff6060;
            transform: scale(1.2);
        }

        /* Update cart btn */
        #update-btn {
            margin-top: 20px;
            background: transparent;
            border: 1.5px solid rgba(255, 255, 255, .30);
            color: rgba(255, 255, 255, .85);
            font-family: 'Anton', sans-serif;
            font-size: 15px;
            letter-spacing: 1px;
            padding: 13px 36px;
            border-radius: 100px;
            cursor: pointer;
            transition: background .22s, border-color .22s, color .22s, transform .22s;
        }

        #update-btn:hover {
            background: rgba(255, 255, 255, .10);
            border-color: rgba(255, 255, 255, .6);
            color: #fff;
            transform: scale(1.03);
        }

        #update-btn.saved {
            background: rgba(184, 224, 74, .18);
            border-color: #b8e04a;
            color: #b8e04a;
        }

        /* Empty state */
        #empty-state {
            display: none;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            padding: 60px 20px;
            gap: 16px;
        }

        #empty-state svg {
            opacity: .35;
        }

        #empty-state p {
            color: rgba(255, 255, 255, .5);
            font-size: 15px;
        }

        #empty-state a {
            background: #fff;
            color: #003F29;
            font-family: 'Anton', sans-serif;
            font-size: 15px;
            letter-spacing: 1px;
            border: none;
            padding: 13px 36px;
            border-radius: 100px;
            cursor: pointer;
            transition: transform .22s;
            display: inline-block;
            margin-top: 4px;
        }

        #empty-state a:hover {
            transform: scale(1.05);
        }

        /* Background drink images */
        .bg-drink {
            position: fixed;
            pointer-events: none;
            z-index: 1;
            object-fit: contain;
        }

        .bd1 {
            width: 240px;
            bottom: -30px;
            left: -40px;
            opacity: .12;
            filter: blur(6px) drop-shadow(0 0 20px #000);
            animation: floatA 8s ease-in-out infinite;
        }

        .bd2 {
            width: 200px;
            top: 60px;
            right: -30px;
            opacity: .10;
            filter: blur(7px) drop-shadow(0 0 20px #000);
            animation: floatB 9s ease-in-out infinite 1.5s;
        }

        .bd3 {
            width: 180px;
            bottom: 80px;
            right: 80px;
            opacity: .09;
            filter: blur(8px) drop-shadow(0 0 20px #000);
            animation: floatC 7.5s ease-in-out infinite 3s;
        }

        /* Order Summary */
        .summary-title {
            font-family: 'Anton', sans-serif;
            font-size: 22px;
            color: #fff;
            letter-spacing: 1px;
            text-transform: uppercase;
            margin-bottom: 20px;
        }

        /* summary rows */
        .sum-row {
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding: 9px 0;
            font-size: 14px;
            color: rgba(255, 255, 255, .65);
            border-bottom: 1px solid rgba(255, 255, 255, .06);
        }

        .sum-row:last-of-type {
            border-bottom: none;
        }

        .sum-row .sum-val {
            font-weight: 600;
            color: rgba(255, 255, 255, .85);
        }

        .sum-total {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin: 16px 0;
            padding-top: 14px;
            border-top: 1.5px solid rgba(255, 255, 255, .12);
        }

        .sum-total .label {
            font-family: 'Anton', sans-serif;
            font-size: 18px;
            color: #fff;
            text-transform: uppercase;
        }

        .sum-total .amount {
            font-family: 'Anton', sans-serif;
            font-size: 26px;
            color: #C8A86A;
        }

        .warranty-note {
            display: flex;
            align-items: flex-start;
            gap: 8px;
            font-size: 12px;
            color: rgba(255, 255, 255, .40);
            line-height: 1.5;
            margin-bottom: 20px;
        }

        .warranty-note svg {
            flex-shrink: 0;
            margin-top: 1px;
            opacity: .6;
        }

        #checkout-btn {
            width: 100%;
            background: #fff;
            color: #003F29;
            font-family: 'Anton', sans-serif;
            font-size: 17px;
            letter-spacing: 1px;
            text-transform: uppercase;
            border: none;
            padding: 16px;
            border-radius: 100px;
            cursor: pointer;
            transition: transform .22s, box-shadow .22s;
            box-shadow: 0 6px 24px rgba(0, 0, 0, .25);
        }

        #checkout-btn:hover {
            transform: scale(1.03);
            box-shadow: 0 10px 36px rgba(0, 0, 0, .35);
        }
    </style>
    <link rel="stylesheet" href="/modern-animations.css">
    <link rel="stylesheet" href="/spa-transitions.css">
</head>

<body>
    <div id="page-container">


    <div class="bg-full"></div>

    <!-- blurred background drinks -->
    <img src="/img/drink-1.png?v=4" class="bg-drink bd1" alt="">
    <img src="/img/drink-2.png?v=4" class="bg-drink bd2" alt="">
    <img src="/img/drink-3.png?v=4" class="bg-drink bd3" alt="">

    <img src="/img/bean.png?v=4" class="bean b1" alt="">
    <img src="/img/bean.png?v=4" class="bean b2" alt="">
    <img src="/img/bean.png?v=4" class="bean b3" alt="">
    <img src="/img/bean.png?v=4" class="bean b4" alt="">
    <img src="/img/bean.png?v=4" class="bean b5" alt="">
    <img src="/img/bean.png?v=4" class="bean b6" alt="">
    <img src="/img/bean.png?v=4" class="bean b7" alt="">
    <img src="/img/bean.png?v=4" class="bean b8" alt="">

    <nav>
        <a href="/index.html"><img src="/img/zestro-logo-white.png" class="logo" alt="Logo"></a>
        <div class="nav-links">
            <a href="/index.html">Home</a>
            <a href="/menu.html">Shop</a>
            <a href="#">Contact</a>
        </div>
        <div class="nav-icons">
            <button id="account-btn" aria-label="Account">
                <svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6"
                    stroke-linecap="round" stroke-linejoin="round">
                    <path d="M19 21v-2a4 4 0 0 0-4-4H9a4 4 0 0 0-4 4v2" />
                    <circle cx="12" cy="7" r="4" />
                </svg>
            </button>
            <button aria-label="Cart" onclick="window.location.href='/cart.html'">
                <svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6"
                    stroke-linecap="round" stroke-linejoin="round">
                    <path d="M6 2 3 6v14a2 2 0 0 0 2 2h14a2 2 0 0 0 2-2V6l-3-4Z" />
                    <path d="M3 6h18" />
                    <path d="M16 10a4 4 0 0 1-8 0" />
                </svg>
            </button>
        </div>
    </nav>

    <div id="page">
        <h1 id="page-title">SHOPPING CART</h1>

        <div id="layout">
            <!-- cart items panel -->
            <div id="cart-panel" class="glass">
                <div class="cart-header">
                    <span>Product</span>
                    <span class="col-qty">Quantity</span>
                    <span class="col-total">Total</span>
                    <span class="col-action">Action</span>
                </div>
                <div id="cart-items-list"></div>
                <div id="empty-state">
                    <svg width="64" height="64" viewBox="0 0 24 24" fill="none" stroke="white" stroke-width="1.2"
                        stroke-linecap="round" stroke-linejoin="round">
                        <path d="M6 2 3 6v14a2 2 0 0 0 2 2h14a2 2 0 0 0 2-2V6l-3-4Z" />
                        <path d="M3 6h18" />
                        <path d="M16 10a4 4 0 0 1-8 0" />
                    </svg>
                    <p>Your cart is empty</p>
                    <a href="/menu.html">Browse Menu</a>
                </div>
            </div>

            <!-- order summary panel -->
            <div id="summary-panel" class="glass">
                <div class="summary-title">Order Summary</div>

                <div class="sum-row"><span>Sub Total</span><span class="sum-val" id="s-subtotal">$0.00</span></div>
                <div class="sum-row"><span>Delivery Fee</span><span class="sum-val">$2.00</span></div>

                <div class="sum-total">
                    <span class="label">Total</span>
                    <span class="amount" id="s-total">$0.00</span>
                </div>

                <div class="warranty-note">
                    <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"
                        stroke-linecap="round" stroke-linejoin="round">
                        <path d="M12 22s8-4 8-10V5l-8-3-8 3v7c0 6 8 10 8 10z" />
                    </svg>
                    <span>From Bean to Doorstep , Freshness You Can Taste.</span>
                </div>

                <button id="checkout-btn" onclick="checkout()">Checkout Now</button>
            </div>
        </div>
    </div>

    <script>
        const DELIVERY = 2.00;
        let cart = JSON.parse(localStorage.getItem('coffeeCart') || '[]');

        /* Render */
        function render() {
            const list = document.getElementById('cart-items-list');
            const empty = document.getElementById('empty-state');
            list.innerHTML = '';
            if (cart.length === 0) {
                empty.style.display = 'flex';
            } else {
                empty.style.display = 'none';
                cart.forEach((item, idx) => {
                    const row = document.createElement('div');
                    row.className = 'cart-item';
                    row.id = `row-${idx}`;
                    row.innerHTML = `
                    <div class="product-col">
                        <img src="${item.image && item.image !== 'null' ? item.image : '/img/drink-1.png'}" alt="${item.name}">
                        <div class="product-info">
                            <div class="item-name">${item.name}</div>
                            <div class="item-sub">Size: ${item.size}</div>
                        </div>
                    </div>
                    <div class="qty-col">
                        <div class="qty-ctrl">
                            <button class="qty-btn" onclick="changeQty(${idx}, -1)">−</button>
                            <span class="qty-val" id="qty-${idx}">${item.qty}</span>
                            <button class="qty-btn" onclick="changeQty(${idx}, 1)">+</button>
                        </div>
                    </div>
                    <div class="total-col">$${(item.price * item.qty).toFixed(2)}</div>
                    <div class="action-col">
                        <button class="del-btn" onclick="removeItem(${idx})" aria-label="Remove">
                            <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                                <polyline points="3 6 5 6 21 6"/><path d="M19 6l-1 14a2 2 0 0 1-2 2H8a2 2 0 0 1-2-2L5 6"/>
                                <path d="M10 11v6"/><path d="M14 11v6"/><path d="M9 6V4h6v2"/>
                            </svg>
                        </button>
                    </div>`;
                    list.appendChild(row);
                });
            }
            updateSummary();
        }

        function changeQty(idx, delta) {
            cart[idx].qty = Math.max(1, cart[idx].qty + delta);
            document.getElementById(`qty-${idx}`).textContent = cart[idx].qty;
            const totalEl = document.querySelectorAll('.total-col')[idx];
            if (totalEl) totalEl.textContent = `$${(cart[idx].price * cart[idx].qty).toFixed(2)}`;
            updateSummary();
            localStorage.setItem('coffeeCart', JSON.stringify(cart));
        }

        function removeItem(idx) {
            const row = document.getElementById(`row-${idx}`);
            row.style.animation = 'rowOut .35s ease forwards';
            setTimeout(() => { 
                cart.splice(idx, 1); 
                localStorage.setItem('coffeeCart', JSON.stringify(cart));
                render(); 
            }, 360);
        }

        function updateSummary() {
            const subtotal = cart.reduce((s, i) => s + i.price * i.qty, 0);
            const total = subtotal + (cart.length ? DELIVERY : 0);
            document.getElementById('s-subtotal').textContent = `$${subtotal.toFixed(2)}`;
            document.getElementById('s-total').textContent = `$${total.toFixed(2)}`;
        }

        function checkout() {
            if (cart.length === 0) {
                window.location.href = '/menu.html';
                return;
            }
            localStorage.setItem('coffeeCart', JSON.stringify(cart));
            window.location.href = '/checkout.html';
        }

        render();
    </script>
    </div>
    <script src="/modern-animations.js"></script>
    <script src="/auth.js"></script>
    <script src="/spa-router.js"></script>
</body>

</html>
