<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Rider Login - Zestro</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Outfit:wght@300;400;500;600;700&display=swap');
        body { font-family: 'Outfit', sans-serif; background-color: #e5e7eb; }
        .glass-panel {
            background: #ffffff;
            border-radius: 1.5rem;
            box-shadow: 0 25px 50px -12px rgba(0, 0, 0, 0.25);
            overflow: hidden;
        }
        .dark-side {
            background-color: #064e3b;
            position: relative;
        }
        .dark-side::before {
            content: '';
            position: absolute;
            top: 0; left: 0; right: 0; bottom: 0;
            background: radial-gradient(circle at 50% 50%, rgba(16, 185, 129, 0.2), transparent 70%);
        }
    </style>
    <link rel="stylesheet" href="/modern-animations.css">
</head>
<body class="min-h-screen flex items-center justify-center p-6 bg-gradient-to-br from-green-100 via-emerald-50 to-teal-100">
    <div class="glass-panel flex flex-col md:flex-row w-full max-w-5xl h-[650px]">
        
        <!-- Left Side: Form -->
        <div class="w-full md:w-1/2 flex flex-col justify-center bg-white relative overflow-hidden">
            <div class="absolute top-8 left-10 flex items-center gap-2 z-20">
                <div class="w-8 h-8 rounded-full bg-green-600 flex items-center justify-center text-white font-bold">R</div>
                <span class="font-bold text-xl tracking-tight text-green-600">Rider App</span>
            </div>
            
            <div id="form-slider" class="flex w-[200%] transition-transform duration-500 ease-in-out transform translate-x-0 mt-16">
                
                <!-- Login Pane -->
                <div class="w-1/2 flex-shrink-0 p-10 md:p-16 pt-0 md:pt-0">
                    <h1 class="text-4xl font-bold text-gray-900 mb-2">Ready to Ride?</h1>
                    <p class="text-gray-500 mb-10 text-sm">Log in to view your active deliveries</p>
                
                <form action="/rider-dashboard.html" method="GET" class="space-y-5">
                    <div>
                        <input type="email" placeholder="Rider Email" required class="w-full px-4 py-4 rounded-xl bg-gray-50 border-none focus:ring-2 focus:ring-green-600 outline-none transition text-sm">
                    </div>
                    <div class="relative">
                        <input type="password" placeholder="Password" required class="w-full px-4 py-4 rounded-xl bg-gray-50 border-none focus:ring-2 focus:ring-green-600 outline-none transition text-sm">
                        <button type="button" class="absolute right-4 top-1/2 -translate-y-1/2 text-gray-400 hover:text-gray-600">
                            <svg xmlns="http://www.w3.org/2000/svg" fill="none" viewBox="0 0 24 24" stroke-width="1.5" stroke="currentColor" class="w-5 h-5">
                                <path stroke-linecap="round" stroke-linejoin="round" d="M3.98 8.223A10.477 10.477 0 001.934 12C3.226 16.338 7.244 19.5 12 19.5c.993 0 1.953-.138 2.863-.395M6.228 6.228A10.45 10.45 0 0112 4.5c4.756 0 8.773 3.162 10.065 7.498a10.523 10.523 0 01-4.293 5.774M6.228 6.228L3 3m3.228 3.228l3.65 3.65m7.894 7.894L21 21m-3.228-3.228l-3.65-3.65m0 0a3 3 0 10-4.243-4.243m4.242 4.242L9.88 9.88" />
                            </svg>
                        </button>
                    </div>
                    
                    <div class="flex justify-end">
                        <a href="#" class="text-xs font-medium text-gray-500 hover:text-green-600 transition">Forget password?</a>
                    </div>
                    
                    <button type="submit" class="w-full py-4 rounded-xl bg-green-600 text-white font-semibold hover:bg-green-700 transition shadow-lg mt-2">
                        Start Shift
                    </button>
                </form>
                
                <div class="my-8 flex items-center">
                    <div class="flex-grow border-t border-gray-200"></div>
                    <span class="mx-4 text-xs text-gray-400">or</span>
                    <div class="flex-grow border-t border-gray-200"></div>
                </div>
                
                <p class="text-center text-xs text-gray-500 mt-8">
                    Don't have a rider account? <button type="button" onclick="toggleForm('register')" class="text-green-600 font-semibold hover:underline bg-transparent border-none cursor-pointer">Sign Up</button>
                </p>
            </div>
            
            <!-- Registration Pane -->
            <div class="w-1/2 flex-shrink-0 p-10 md:p-16 pt-0 md:pt-0">
                <h1 class="text-4xl font-bold text-gray-900 mb-2">Join Our Fleet</h1>
                <p class="text-gray-500 mb-10 text-sm">Sign up as a delivery rider today</p>
                
                <form action="/rider-dashboard.html" method="GET" class="space-y-4">
                    <div>
                        <input type="text" placeholder="Full Name" required class="w-full px-4 py-3.5 rounded-xl bg-gray-50 border-none focus:ring-2 focus:ring-green-600 outline-none transition text-sm">
                    </div>
                    <div>
                        <input type="email" placeholder="Email Address" required class="w-full px-4 py-3.5 rounded-xl bg-gray-50 border-none focus:ring-2 focus:ring-green-600 outline-none transition text-sm">
                    </div>
                    <div>
                        <input type="text" placeholder="Vehicle License Plate" required class="w-full px-4 py-3.5 rounded-xl bg-gray-50 border-none focus:ring-2 focus:ring-green-600 outline-none transition text-sm">
                    </div>
                    <div>
                        <input type="password" placeholder="Password" required class="w-full px-4 py-3.5 rounded-xl bg-gray-50 border-none focus:ring-2 focus:ring-green-600 outline-none transition text-sm">
                    </div>
                    
                    <button type="submit" class="w-full py-4 rounded-xl bg-green-600 text-white font-semibold hover:bg-green-700 transition shadow-lg mt-4">
                        Register
                    </button>
                </form>
                
                <p class="text-center text-xs text-gray-500 mt-8">
                    Already a rider? <button type="button" onclick="toggleForm('login')" class="text-green-600 font-semibold hover:underline bg-transparent border-none cursor-pointer">Sign In</button>
                </p>
            </div>
            
        </div>
    </div>
        
        <!-- Right Side: Dark Visual -->
        <div class="hidden md:flex w-1/2 dark-side flex-col items-center justify-between p-12 text-center text-white rounded-r-3xl overflow-hidden relative">
            <div class="flex-1 flex items-center justify-center z-10 w-full">
                <img src="/rider-3d.png" alt="Illustration" class="max-w-full max-h-80 object-contain drop-shadow-2xl hover:scale-105 transition-transform duration-700">
            </div>
            
            <div class="z-10 mt-8">
                <h2 class="text-2xl font-bold mb-3 text-green-400">Deliver with Speed</h2>
                <p class="text-gray-300 text-sm max-w-sm mx-auto leading-relaxed">Manage your deliveries, navigate to customers, and track your earnings on the go.</p>
            </div>
            
            <div class="flex gap-2 mt-10 z-10">
                <div class="w-1.5 h-1.5 rounded-full bg-green-800"></div>
                <div class="w-1.5 h-1.5 rounded-full bg-green-800"></div>
                <div class="w-6 h-1.5 rounded-full bg-green-500"></div>
            </div>
        </div>
        
    </div>

    <script>
        function toggleForm(type) {
            const slider = document.getElementById('form-slider');
            if (type === 'register') {
                slider.classList.remove('translate-x-0');
                slider.classList.add('-translate-x-1/2');
            } else {
                slider.classList.remove('-translate-x-1/2');
                slider.classList.add('translate-x-0');
            }
        }
    </script>
    <script src="/modern-animations.js"></script>
</body>
</html>
