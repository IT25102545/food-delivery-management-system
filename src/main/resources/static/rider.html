<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Rider Dashboard</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://fonts.googleapis.com/css2?family=Outfit:wght@300;400;500;600;700;800;900&display=swap"
        rel="stylesheet">
    <!-- leaflet css & js -->
    <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css"
        integrity="sha256-p4NxAoJBhIIN+hmNHrzRCf9tD/miZyoHS5obTRR9BMY=" crossorigin="" />
    <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"
        integrity="sha256-20nQCchB9co0qIjJZRGuk2/Z9VM+kNiyxNV1lvTlZBo=" crossorigin=""></script>
    <script>
        tailwind.config = {
            theme: {
                extend: {
                    fontFamily: { sans: ['Outfit', 'sans-serif'] },
                    colors: {
                        donezo: {
                            dark: '#0f4d30',
                            light: '#146b42',
                            bg: '#f4f7f6',
                            card: '#ffffff'
                        }
                    }
                }
            }
        }
    </script>
    <style>
        body {
            background: #f4f7f6;
        }

        .bottom-nav-icon {
            width: 24px;
            height: 24px;
            color: #a1a1aa;
        }

        .nav-btn.active {
            color: #146b42;
            font-weight: 600;
        }

        .nav-btn.active .bottom-nav-icon {
            color: #146b42;
        }

        .toggle-checkbox:checked {
            right: 0;
            border-color: #146b42;
        }

        .toggle-checkbox:checked+.toggle-label {
            background-color: #146b42;
        }

        .toggle-checkbox:checked+.toggle-label:after {
            transform: translateX(100%);
            border-color: white;
        }

        /* LOADER */
        #loader-wrapper {
            position: fixed;
            inset: 0;
            background: #003F29;
            z-index: 9999;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            transition: opacity 0.6s ease, visibility 0.6s ease;
        }

        #loader-wrapper.hidden {
            opacity: 0;
            visibility: hidden;
        }

        .loader-logo {
            width: 160px;
            height: auto;
            object-fit: contain;
            animation: loaderPulse 1.8s infinite ease-in-out;
            margin-bottom: 40px;
        }

        .loader-progress-bar {
            width: 220px;
            height: 3px;
            background: rgba(255, 255, 255, 0.15);
            border-radius: 4px;
            overflow: hidden;
            position: relative;
        }

        .loader-progress {
            position: absolute;
            top: 0;
            left: 0;
            height: 100%;
            width: 0%;
            background: #ffffff;
            animation: loaderFill 1.5s ease-out forwards;
        }

        @keyframes loaderPulse {

            0%,
            100% {
                transform: scale(1);
                opacity: 0.85;
            }

            50% {
                transform: scale(1.06);
                opacity: 1;
            }
        }

        @keyframes loaderFill {
            0% {
                width: 0%;
            }

            40% {
                width: 60%;
            }

            100% {
                width: 100%;
            }
        }
    </style>
</head>

<body
    class="antialiased text-gray-800 h-screen w-screen overflow-hidden bg-donezo-bg flex flex-col md:flex-row relative">
    <!-- premium loader -->
    <div id="loader-wrapper">
        <img src="/img/zestro-logo-white.png" class="loader-logo" alt="Zestro Logo">
        <div class="loader-progress-bar">
            <div class="loader-progress"></div>
        </div>
    </div>

    <!-- intro screen -->
    <div id="intro-screen"
        class="fixed inset-0 z-[90] bg-[#10a552] flex flex-col hidden overflow-hidden transition-opacity duration-500">
        <!-- full background image -->
        <img src="/img/Rider login screen background.png"
            class="absolute inset-0 w-full h-full object-cover object-bottom" alt="Background">

        <!-- overlay content -->
        <div class="relative z-10 flex flex-col h-full w-full">
            <!-- top content -->
            <div class="flex flex-col items-center pt-16 w-full">
                <img src="/img/Zestro logo Green.png" alt="Zestro Logo"
                    class="h-24 w-auto mb-3 object-contain mix-blend-multiply">
                <h1 class="text-[40px] leading-none text-[#0b4d26] uppercase mt-2 tracking-tighter drop-shadow-sm"
                    style="font-family: 'Impact', 'Arial Black', sans-serif; transform: scaleY(1.1); -webkit-text-stroke: 0.5px transparent;">
                    Zestro Rider
                </h1>
            </div>

            <!-- bottom actions -->
            <div class="w-full mt-auto flex flex-col items-center pb-12">
                <div class="w-full max-w-[320px] px-4">
                    <a href="/rider-login.html"
                        class="block w-full text-center bg-[#0b4d26] text-white font-bold py-4 rounded-full text-[17px] mb-6 hover:bg-[#063017] transition shadow-lg">Log
                        in</a>
                    <p class="text-center font-bold text-[#0b4d26] text-[15px]">New to Grab? <a
                            href="/rider-register.html" class="underline hover:text-black transition">Sign up!</a></p>
                </div>
            </div>
        </div>
    </div>

    <script>
        const riderSession = localStorage.getItem('riderUser');
        window.addEventListener('load', () => {
            setTimeout(() => {
                const loader = document.getElementById('loader-wrapper');
                const intro = document.getElementById('intro-screen');

                if (riderSession) {
                    loader.classList.add('hidden');
                } else {
                    intro.classList.remove('hidden');
                    setTimeout(() => {
                        loader.classList.add('hidden');
                    }, 50);
                }
            }, 2000);
        });
    </script>

    <!-- map background (full on mobile, right flex-1 on desktop) -->
    <div id="map" class="absolute inset-0 z-0 md:relative md:flex-1 md:order-2"></div>

    <!-- ui container (bottom overlay on mobile, left sidebar on desktop) -->
    <div
        class="w-full h-full md:w-[400px] md:h-screen relative z-10 flex flex-col justify-between md:justify-start pointer-events-none md:pointer-events-auto md:bg-white md:shadow-[4px_0_24px_rgba(0,0,0,0.05)] md:border-r border-gray-100 transition-all md:order-1">

        <!-- desktop header -->
        <div class="hidden md:flex h-20 items-center px-8 border-b border-gray-100 bg-white shrink-0">
            <div class="flex items-center gap-3">
                <img src="/img/zestro-logo-green.png" alt="Zestro Logo" class="w-10 h-10 object-contain">
                <span class="text-xl font-bold text-gray-800">Zestro Rider</span>
            </div>
        </div>

        <!-- desktop navigation (replaces bottom nav) -->
        <div class="hidden md:flex px-6 py-4 border-b border-gray-100 bg-white gap-2 justify-between shrink-0">
            <div class="nav-btn flex flex-col items-center gap-1 active cursor-pointer p-2 hover:bg-gray-50 rounded-lg transition"
                onclick="switchView('home')">
                <svg class="w-5 h-5 bottom-nav-icon" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                    <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2"
                        d="M3 12l2-2m0 0l7-7 7 7M5 10v10a1 1 0 001 1h3m10-11l2 2m-2-2v10a1 1 0 01-1 1h-3m-6 0a1 1 0 001-1v-4a1 1 0 011-1h2a1 1 0 011 1v4a1 1 0 001 1m-6 0h6" />
                </svg>
                <span class="text-[10px] font-medium">Home</span>
            </div>
            <div class="nav-btn flex flex-col items-center gap-1 text-gray-400 cursor-pointer p-2 hover:bg-gray-50 rounded-lg transition"
                onclick="switchView('wallet')">
                <svg class="w-5 h-5 bottom-nav-icon" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                    <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2"
                        d="M3 10h18M7 15h1m4 0h1m-7 4h12a3 3 0 003-3V8a3 3 0 00-3-3H6a3 3 0 00-3 3v8a3 3 0 003 3z" />
                </svg>
                <span class="text-[10px] font-medium">Wallet</span>
            </div>
            <div class="nav-btn flex flex-col items-center gap-1 text-gray-400 cursor-pointer p-2 hover:bg-gray-50 rounded-lg transition"
                onclick="switchView('profile')">
                <svg class="w-5 h-5 bottom-nav-icon" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                    <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2"
                        d="M16 7a4 4 0 11-8 0 4 4 0 018 0zM12 14a7 7 0 00-7 7h14a7 7 0 00-7-7z" />
                </svg>
                <span class="text-[10px] font-medium">Profile</span>
            </div>
        </div>

        <!-- mobile top bar (floating) -->
        <div class="px-4 py-8 pointer-events-auto flex justify-between items-start md:hidden shrink-0">
            <button
                class="w-12 h-12 bg-white rounded-full shadow-lg flex items-center justify-center text-gray-700 hover:bg-gray-50 transition">
                <img src="/img/zestro-logo-green.png" class="w-6 h-6 object-contain" alt="Logo">
            </button>

            <div class="bg-white rounded-full shadow-lg flex items-center p-1 pl-4 pr-1">
                <span class="text-sm font-bold text-gray-800 mr-3" id="status-text">Online</span>
                <div class="relative inline-block w-12 align-middle select-none transition duration-200 ease-in">
                    <input type="checkbox" name="toggle" id="toggle"
                        class="toggle-checkbox absolute block w-6 h-6 rounded-full bg-white border-4 appearance-none cursor-pointer z-10 transition-transform duration-200 ease-in-out left-0 top-0 checked:translate-x-full checked:border-donezo-light"
                        checked />
                    <label for="toggle"
                        class="toggle-label block overflow-hidden h-6 rounded-full bg-gray-300 cursor-pointer transition-colors duration-200 ease-in-out"></label>
                </div>
            </div>

            <div class="w-12 h-12"></div> <!-- spacer for alignment -->
        </div>

        <!-- bottom/sidebar content area -->
        <div class="pointer-events-auto flex flex-col md:flex-1 md:overflow-y-auto">

            <!-- dynamic container -->
            <div id="bottom-sheet"
                class="bg-white rounded-t-3xl md:rounded-none shadow-[0_-10px_40px_rgba(0,0,0,0.1)] md:shadow-none transition-transform duration-300 transform translate-y-0 w-full overflow-hidden md:flex-1">
                <!-- state content dynamic -->
            </div>

            <!-- desktop status toggle -->
            <div class="hidden md:flex p-6 border-t border-gray-100 bg-white items-center justify-between mt-auto">
                <div>
                    <p class="font-bold text-gray-900" id="status-text-desktop">Online</p>
                    <p class="text-xs text-gray-500">Ready for deliveries</p>
                </div>
                <div class="relative inline-block w-12 align-middle select-none transition duration-200 ease-in">
                    <input type="checkbox" name="toggle-desktop" id="toggle-desktop"
                        class="toggle-checkbox absolute block w-6 h-6 rounded-full bg-white border-4 appearance-none cursor-pointer z-10 transition-transform duration-200 ease-in-out left-0 top-0 checked:translate-x-full checked:border-donezo-light"
                        checked />
                    <label for="toggle-desktop"
                        class="toggle-label block overflow-hidden h-6 rounded-full bg-gray-300 cursor-pointer transition-colors duration-200 ease-in-out"></label>
                </div>
            </div>

            <!-- mobile bottom navigation -->
            <div
                class="md:hidden bg-white border-t border-gray-100 px-6 py-3 flex justify-between items-center pb-8 shadow-[0_-5px_20px_rgba(0,0,0,0.05)] w-full">
                <div class="nav-btn flex flex-col items-center gap-1 active cursor-pointer"
                    onclick="switchView('home')">
                    <svg class="bottom-nav-icon" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                        <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2"
                            d="M3 12l2-2m0 0l7-7 7 7M5 10v10a1 1 0 001 1h3m10-11l2 2m-2-2v10a1 1 0 01-1 1h-3m-6 0a1 1 0 001-1v-4a1 1 0 011-1h2a1 1 0 011 1v4a1 1 0 001 1m-6 0h6" />
                    </svg>
                    <span class="text-[10px]">Home</span>
                </div>
                <div class="nav-btn flex flex-col items-center gap-1 text-gray-400 cursor-pointer hover:text-gray-600 transition"
                    onclick="switchView('wallet')">
                    <svg class="bottom-nav-icon" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                        <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2"
                            d="M3 10h18M7 15h1m4 0h1m-7 4h12a3 3 0 003-3V8a3 3 0 00-3-3H6a3 3 0 00-3 3v8a3 3 0 003 3z" />
                    </svg>
                    <span class="text-[10px]">Wallet</span>
                </div>
                <div class="nav-btn flex flex-col items-center gap-1 text-gray-400 cursor-pointer hover:text-gray-600 transition"
                    onclick="switchView('profile')">
                    <svg class="bottom-nav-icon" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                        <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2"
                            d="M16 7a4 4 0 11-8 0 4 4 0 018 0zM12 14a7 7 0 00-7 7h14a7 7 0 00-7-7z" />
                    </svg>
                    <span class="text-[10px]">Profile</span>
                </div>
            </div>

        </div>
    </div>

    <!-- full-screen modals (wallet/history/profile) injected as overlays over map/sidebar -->
    <div id="full-screen-view"
        class="fixed inset-0 z-50 transform translate-y-full transition-transform duration-300 flex flex-col hidden bg-gray-50/90 backdrop-blur-sm p-0 md:p-10 pointer-events-none">
        <div
            class="bg-white md:rounded-3xl shadow-2xl flex-1 flex flex-col max-w-2xl mx-auto w-full pointer-events-auto h-full border border-gray-100 overflow-hidden">
            <div class="px-6 py-6 border-b border-gray-100 flex items-center justify-between">
                <button onclick="closeFullScreen()"
                    class="w-10 h-10 rounded-full bg-gray-100 flex items-center justify-center text-gray-600 hover:bg-gray-200 transition">
                    <svg class="w-6 h-6" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                        <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M15 19l-7-7 7-7" />
                    </svg>
                </button>
                <h2 class="text-xl font-bold text-gray-900" id="fs-title">View</h2>
                <div class="w-10"></div>
            </div>
            <div id="fs-content" class="flex-1 overflow-y-auto p-6 bg-gray-50">
            </div>
        </div>
    </div>

    <!-- toast notification -->
    <div id="toast"
        class="fixed top-6 right-6 md:right-10 z-[60] transform transition-all duration-500 translate-x-[150%] opacity-0 pointer-events-auto">
        <div
            class="bg-white border-l-4 border-donezo-light shadow-2xl rounded-r-xl p-5 w-80 flex items-start gap-4 ring-1 ring-black/5">
            <div class="text-donezo-light text-3xl mt-0.5 animate-bounce">🔔</div>
            <div class="flex-1">
                <h4 class="text-sm font-bold text-gray-900" id="toast-title">New Order Arrived!</h4>
                <p id="toast-msg" class="text-xs text-gray-500 mt-1 leading-relaxed">Check your screen</p>
                <div class="mt-3 text-right">
                    <button onclick="dismissToast()"
                        class="text-donezo-light text-xs font-bold hover:underline">Dismiss</button>
                </div>
            </div>
        </div>
    </div>

    <script>
        // --- map initialization 
        let map;
        let markerRider, markerPickup, markerDropoff;
        let routeLine;
        const SRI_LANKA_CENTER = [6.9271, 79.8612]; // default to a mockup-like location in colombo, sri lanka

        function initMap() {
            map = L.map('map', { zoomControl: false }).setView(SRI_LANKA_CENTER, 14);
            L.tileLayer('https://{s}.basemaps.cartocdn.com/rastertiles/voyager/{z}/{x}/{y}{r}.png', {
                attribution: '&copy; OpenStreetMap',
                maxZoom: 19
            }).addTo(map);

            // add zoom controls to the right (like mockup)
            L.control.zoom({ position: 'bottomright' }).addTo(map);

            // rider icon
            const riderIcon = L.divIcon({
                className: 'custom-icon',
                html: `<div class="w-8 h-8 bg-[#146b42] rounded-full flex items-center justify-center shadow-lg border-2 border-white"><svg class="w-4 h-4 text-white transform -rotate-45" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M12 19l9 2-9-18-9 18 9-2zm0 0v-8"/></svg></div>`,
                iconSize: [32, 32],
                iconAnchor: [16, 16]
            });

            // pickup icon
            const pickupIcon = L.divIcon({
                className: 'custom-icon',
                html: `<div class="w-8 h-8 bg-purple-600 rounded-full flex items-center justify-center shadow-lg border-2 border-white"><svg class="w-4 h-4 text-white" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M19 21V5a2 2 0 00-2-2H7a2 2 0 00-2 2v16m14 0h2m-2 0h-5m-9 0H3m2 0h5M9 7h1m-1 4h1m4-4h1m-1 4h1m-5 10v-5a1 1 0 011-1h2a1 1 0 011 1v5m-4 0h4"/></svg></div>`,
                iconSize: [32, 32],
                iconAnchor: [16, 16]
            });

            // dropoff icon
            const dropoffIcon = L.divIcon({
                className: 'custom-icon',
                html: `<div class="w-8 h-8 bg-[#146b42] rounded-full flex items-center justify-center shadow-lg border-2 border-white text-white font-bold text-xs"><svg class="w-4 h-4" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M3 12l2-2m0 0l7-7 7 7M5 10v10a1 1 0 001 1h3m10-11l2 2m-2-2v10a1 1 0 01-1 1h-3m-6 0a1 1 0 001-1v-4a1 1 0 011-1h2a1 1 0 011 1v4a1 1 0 001 1m-6 0h6"/></svg></div>`,
                iconSize: [32, 32],
                iconAnchor: [16, 16]
            });

            markerRider = L.marker(SRI_LANKA_CENTER, { icon: riderIcon, zIndexOffset: 1000 }).addTo(map);

            // reusable markers for order
            markerPickup = L.marker([6.9317, 79.8625], { icon: pickupIcon });
            markerDropoff = L.marker([6.9217, 79.8575], { icon: dropoffIcon });
        }

        function drawRoute() {
            if (routeLine) map.removeLayer(routeLine);
            const latlngs = [
                markerPickup.getLatLng(),
                [6.9271, 79.8625],
                [6.9271, 79.8575],
                markerDropoff.getLatLng()
            ];
            routeLine = L.polyline(latlngs, { color: '#146b42', weight: 4, opacity: 0.8, dashArray: '10, 10' }).addTo(map);

            // bounds
            const bounds = L.latLngBounds([markerPickup.getLatLng(), markerDropoff.getLatLng()]);
            map.fitBounds(bounds, { padding: [50, 200] }); // add padding for bottom sheet
        }

        function clearRoute() {
            if (routeLine) map.removeLayer(routeLine);
            map.removeLayer(markerPickup);
            map.removeLayer(markerDropoff);
            map.setView(SRI_LANKA_CENTER, 14);
        }

        // --- state machine & globals 
        let currentState = 'IDLE'; // idle, offer, pickup, dropoff
        let currentOrder = null;
        let totalEarnings = 0;
        let deliveriesToday = 0;
        let userData = null;
        let pollInterval = null;
        const bottomSheet = document.getElementById('bottom-sheet');
        const toggle = document.getElementById('toggle');
        const statusText = document.getElementById('status-text');

        // load rider data
        try {
            userData = JSON.parse(localStorage.getItem('riderUser'));
            if (userData && userData.total_earned) {
                totalEarnings = parseFloat(userData.total_earned);
                deliveriesToday = parseInt(userData.total_deliveries || 0); // roughly map total to today for mockup
            }
        } catch (e) { }

        // --- ui rendering 
        function renderState() {
            if (currentState === 'IDLE') {
                clearRoute();
                if (toggle.checked) {
                    bottomSheet.innerHTML = `
                        <div class="bg-[#146b42] text-white text-center py-2 text-xs font-semibold flex items-center justify-center gap-2 animate-pulse">
                            <svg class="w-4 h-4 animate-spin" fill="none" viewBox="0 0 24 24"><circle class="opacity-25" cx="12" cy="12" r="10" stroke="currentColor" stroke-width="4"></circle><path class="opacity-75" fill="currentColor" d="M4 12a8 8 0 018-8V0C5.373 0 0 5.373 0 12h4zm2 5.291A7.962 7.962 0 014 12H0c0 3.042 1.135 5.824 3 7.938l3-2.647z"></path></svg>
                            Searching for new delivery rides
                        </div>
                        <div class="p-6 grid grid-cols-2 gap-4">
                            <div class="bg-blue-50 rounded-2xl p-4 border border-blue-100">
                                <div class="w-8 h-8 bg-blue-900 rounded-full flex items-center justify-center text-white mb-6">
                                    <svg class="w-4 h-4" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M9 5H7a2 2 0 00-2 2v12a2 2 0 002 2h10a2 2 0 002-2V7a2 2 0 00-2-2h-2M9 5a2 2 0 002 2h2a2 2 0 002-2M9 5a2 2 0 012-2h2a2 2 0 012 2m-3 7h3m-3 4h3m-6-4h.01M9 16h.01"/></svg>
                                </div>
                                <p class="text-xs font-semibold text-gray-500 mb-1">Deliveries today</p>
                                <p class="text-2xl font-black text-gray-900">${String(deliveriesToday).padStart(2, '0')}</p>
                            </div>
                            <div class="bg-orange-50 rounded-2xl p-4 border border-orange-100">
                                <div class="w-8 h-8 bg-gray-900 rounded-full flex items-center justify-center text-white mb-6">
                                    <svg class="w-4 h-4" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M12 8c-1.657 0-3 .895-3 2s1.343 2 3 2 3 .895 3 2-1.343 2-3 2m0-8c1.11 0 2.08.402 2.599 1M12 8V7m0 1v8m0 0v1m0-1c-1.11 0-2.08-.402-2.599-1M21 12a9 9 0 11-18 0 9 9 0 0118 0z"/></svg>
                                </div>
                                <p class="text-xs font-semibold text-gray-500 mb-1">Earning today</p>
                                <p class="text-2xl font-black text-gray-900">$${totalEarnings.toFixed(2)}</p>
                            </div>
                        </div>
                    `;
                } else {
                    bottomSheet.innerHTML = `
                        <div class="p-8 text-center text-gray-500">
                            <svg class="w-12 h-12 mx-auto mb-3 text-gray-300" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M18.364 5.636l-3.536 3.536m0 5.656l3.536 3.536M9.172 9.172L5.636 5.636m3.536 9.192l-3.536 3.536M21 12a9 9 0 11-18 0 9 9 0 0118 0zm-5 0a4 4 0 11-8 0 4 4 0 018 0z"/></svg>
                            <p class="font-medium text-lg text-gray-700">You are offline</p>
                            <p class="text-sm">Go online to start receiving delivery requests.</p>
                        </div>
                    `;
                }
            } else if (currentState === 'OFFER' && currentOrder) {
                const deliveryPay = (currentOrder.deliveryFee || 2.50).toFixed(2);
                const tips = (currentOrder.totalAmount * 0.15).toFixed(2);
                const totalEst = (parseFloat(deliveryPay) + parseFloat(tips)).toFixed(2);

                markerPickup.addTo(map);
                markerDropoff.addTo(map);
                drawRoute();

                bottomSheet.innerHTML = `
                    <div class="p-6">
                        <div class="mb-4">
                            <h2 class="text-4xl font-black text-gray-900">$${totalEst}</h2>
                            <p class="text-sm text-gray-500 font-medium">2.3 km • Deliver by ${new Date(Date.now() + 30 * 60000).toLocaleTimeString([], { hour: '2-digit', minute: '2-digit' })}</p>
                        </div>
                        
                        <div class="relative pl-6 mb-6">
                            <!-- timeline line -->
                            <div class="absolute left-[11px] top-2 bottom-2 w-0.5 bg-gray-200 z-0"></div>
                            
                            <div class="relative z-10 mb-4">
                                <div class="absolute -left-6 top-1 w-3 h-3 rounded-full bg-gray-900 border-2 border-white ring-2 ring-gray-900/20"></div>
                                <p class="text-[10px] text-gray-400 font-bold uppercase">Restaurant pickup</p>
                                <p class="font-bold text-gray-900">Zestro Kitchen</p>
                                <p class="text-xs text-gray-500 truncate">12A Block, Colombo 03</p>
                            </div>
                            
                            <div class="relative z-10">
                                <div class="absolute -left-[23px] top-1 w-2 h-2 bg-gray-900"></div>
                                <p class="text-[10px] text-gray-400 font-bold uppercase">Customer dropoff</p>
                                <p class="font-bold text-gray-900 truncate">${currentOrder.firstName} ${currentOrder.lastName}</p>
                                <p class="text-xs text-gray-500 truncate">${currentOrder.deliveryAddress || 'Location provided on map'}</p>
                            </div>
                        </div>

                        <div class="flex gap-3 mt-2">
                            <button onclick="declineOrder()" class="flex-1 py-4 bg-red-500 text-white rounded-xl font-bold hover:bg-red-600 transition active:scale-95 shadow-[0_5px_15px_rgba(239,68,68,0.3)]">Decline</button>
                            <button onclick="acceptOrder()" class="flex-[2] py-4 bg-[#146b42] text-white rounded-xl font-bold hover:bg-[#0f4d30] transition active:scale-95 shadow-[0_5px_15px_rgba(20,107,66,0.3)]">Accept</button>
                        </div>
                    </div>
                `;
            } else if (currentState === 'PICKUP' && currentOrder) {
                // remove route, just focus on restaurant (pickup)
                if (routeLine) map.removeLayer(routeLine);
                map.removeLayer(markerDropoff); // hide dropoff for now
                map.setView(markerPickup.getLatLng(), 15);

                bottomSheet.innerHTML = `
                    <div class="p-6">
                        <div class="flex justify-between items-start mb-4">
                            <div>
                                <h2 class="text-xl font-bold text-gray-900">Zestro Kitchen</h2>
                                <p class="text-sm text-gray-500 flex items-center gap-1 mt-1">
                                    <svg class="w-4 h-4" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M17.657 16.657L13.414 20.9a1.998 1.998 0 01-2.827 0l-4.244-4.243a8 8 0 1111.314 0z"/><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M15 11a3 3 0 11-6 0 3 3 0 016 0z"/></svg>
                                    12A Block, Colombo 03
                                </p>
                            </div>
                            <div class="flex gap-2">
                                <button class="w-10 h-10 rounded-full border border-gray-200 flex items-center justify-center text-gray-700 hover:bg-gray-50">
                                    <svg class="w-5 h-5" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M8 12h.01M12 12h.01M16 12h.01M21 12c0 4.418-4.03 8-9 8a9.863 9.863 0 01-4.255-.949L3 20l1.395-3.72C3.512 15.042 3 13.574 3 12c0-4.418 4.03-8 9-8s9 3.582 9 8z"/></svg>
                                </button>
                                <button class="w-10 h-10 rounded-full border border-gray-200 flex items-center justify-center text-gray-700 hover:bg-gray-50">
                                    <svg class="w-5 h-5" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M3 5a2 2 0 012-2h3.28a1 1 0 01.948.684l1.498 4.493a1 1 0 01-.502 1.21l-2.257 1.13a11.042 11.042 0 005.516 5.516l1.13-2.257a1 1 0 011.21-.502l4.493 1.498a1 1 0 01.684.949V19a2 2 0 01-2 2h-1C9.716 21 3 14.284 3 6V5z"/></svg>
                                </button>
                            </div>
                        </div>

                        <div class="bg-gray-50 rounded-xl p-4 mb-6 border border-gray-100">
                            <p class="text-xs font-bold text-gray-800 mb-1">Restaurant note:</p>
                            <p class="text-sm text-gray-600">Please quote Order #${currentOrder.id} at the pickup window.</p>
                        </div>

                        <button onclick="confirmPickup()" class="w-full py-4 bg-blue-600 text-white rounded-xl font-bold hover:bg-blue-700 transition active:scale-95 shadow-[0_5px_15px_rgba(37,99,235,0.3)] text-lg">
                            Confirm Pickup
                        </button>
                    </div>
                `;
            } else if (currentState === 'DROPOFF' && currentOrder) {
                // focus on customer (dropoff)
                markerDropoff.addTo(map);
                map.removeLayer(markerPickup); // hide pickup
                map.setView(markerDropoff.getLatLng(), 16);

                const isCOD = (currentOrder.paymentMethod || currentOrder.payment_method) === 'COD';
                const cashBanner = isCOD ? `
                    <div style="margin:16px 16px 0;background:#fffbeb;border:2px solid #f59e0b;border-radius:16px;padding:14px 16px;display:flex;align-items:center;gap:12px;box-shadow:0 4px 12px rgba(245,158,11,0.15)">
                        <div style="font-size:28px">&#128181;</div>
                        <div>
                            <p style="font-size:10px;font-weight:800;color:#92400e;text-transform:uppercase;letter-spacing:0.08em">Collect Cash from Customer</p>
                            <p style="font-size:22px;font-weight:900;color:#78350f">$${currentOrder.totalAmount.toFixed(2)}</p>
                        </div>
                    </div>` : '';

                const deliverBtn = isCOD
                    ? `<button onclick="collectCash()" style="width:100%;padding:16px;background:#f59e0b;color:#fff;border:none;border-radius:12px;font-weight:800;font-size:16px;cursor:pointer;box-shadow:0 5px 15px rgba(245,158,11,0.3);">&#128181; Confirm Cash Collected &amp; Deliver</button>`
                    : `<button onclick="completeOrder()" style="width:100%;padding:16px;background:#146b42;color:#fff;border:none;border-radius:12px;font-weight:800;font-size:16px;cursor:pointer;box-shadow:0 5px 15px rgba(20,107,66,0.3);">Arrived &amp; Delivered</button>`;

                bottomSheet.innerHTML = `
                    <div>
                        ${cashBanner}
                        <div class="p-6 ${isCOD ? 'pt-4' : ''}">
                            <div class="flex justify-between items-start mb-4">
                                <div>
                                    <h2 class="text-xl font-bold text-gray-900">${currentOrder.firstName} ${currentOrder.lastName}</h2>
                                    <p class="text-sm text-gray-500 flex items-center gap-1 mt-1">
                                        <svg class="w-4 h-4" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M17.657 16.657L13.414 20.9a1.998 1.998 0 01-2.827 0l-4.244-4.243a8 8 0 1111.314 0z"/><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M15 11a3 3 0 11-6 0 3 3 0 016 0z"/></svg>
                                        ${currentOrder.deliveryAddress || 'Location provided on map'}
                                    </p>
                                </div>
                            </div>
                            <div class="bg-gray-50 rounded-xl p-4 mb-6 border border-gray-100">
                                <p class="text-xs font-bold text-gray-800 mb-1">Customer note:</p>
                                <p class="text-sm text-gray-600">${currentOrder.notes || 'No special instructions.'}</p>
                            </div>
                            ${deliverBtn}
                        </div>
                    </div>
                `;
            }
        }

        // --- api interactions 
        async function fetchDeliveries() {
            if (currentState !== 'IDLE') return; // only fetch if we are idle and waiting
            try {
                const response = await fetch('/api/orders/status/OUT_FOR_DELIVERY');
                if (!response.ok) return;
                const orders = await response.json();

                if (orders.length > 0) {
                    // pick the first one to offer
                    currentOrder = orders[0];
                    currentState = 'OFFER';
                    showToast(`New offer: ${currentOrder.firstName} ${currentOrder.lastName}`);
                    renderState();
                }
            } catch (err) {
                console.error("Failed to load deliveries:", err);
            }
        }

        function declineOrder() {
            currentOrder = null;
            currentState = 'IDLE';
            renderState();
            // in a real app we'd tell the server we declined so it doesn't offer it again immediately
        }

        function acceptOrder() {
            // for now, optimistic transition. server isn't updated until completion in our flow
            currentState = 'PICKUP';
            renderState();
        }

        async function confirmPickup() {
            if (!currentOrder) return;
            try {
                // update order to picked_up in db to trigger admin toast
                await fetch('/api/orders/' + currentOrder.id + '/status', {
                    method: 'PUT',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ status: 'PICKED_UP' })
                });

                currentState = 'DROPOFF';
                renderState();
            } catch (err) {
                console.error(err);
                alert("Network error updating status");
            }
        }

        async function completeOrder() {
            if (!currentOrder || !userData || !userData.id) return;

            const deliveryPay = parseFloat((currentOrder.deliveryFee || 2.50).toFixed(2));
            const tips = parseFloat((currentOrder.totalAmount * 0.15).toFixed(2));
            const addedEarnings = deliveryPay + tips;

            try {
                const payload = {
                    status: 'DELIVERED',
                    riderId: userData.id,
                    earnings: addedEarnings
                };

                const response = await fetch('/api/orders/' + currentOrder.id + '/status', {
                    method: 'PUT',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify(payload)
                });

                if (response.ok) {
                    totalEarnings += addedEarnings;
                    deliveriesToday++;

                    // reset to idle
                    currentOrder = null;
                    currentState = 'IDLE';
                    renderState();
                } else {
                    alert('Failed to complete order.');
                }
            } catch (err) {
                console.error(err);
                alert('Network error.');
            }
        }

        async function collectCash() {
            if (!currentOrder) return;
            try {
                const res = await fetch('/api/orders/' + currentOrder.id + '/cash-collected', {
                    method: 'PUT',
                    headers: { 'Content-Type': 'application/json' }
                });
                if (res.ok) {
                    showToast('Cash collected! Completing delivery...');
                    setTimeout(() => completeOrder(), 1000);
                } else {
                    alert('Failed to confirm cash collection.');
                }
            } catch (err) {
                console.error(err);
                alert('Network error.');
            }
        }

        async function deleteRiderAccount() {
            if (!userData || !userData.id) return;
            const confirmed = prompt('Type DELETE to confirm account deletion:');
            if (confirmed !== 'DELETE') {
                alert('Deletion cancelled.');
                return;
            }
            try {
                const res = await fetch('/api/users/' + userData.id, { method: 'DELETE' });
                if (res.ok) {
                    alert('Account deleted.');
                    localStorage.removeItem('riderUser');
                    window.location.href = '/rider.html';
                } else {
                    alert('Failed to delete account.');
                }
            } catch (err) {
                console.error(err);
                alert('Network error.');
            }
        }

        // --- full screen views logic 
        function switchView(viewName) {
            // reset active state on nav buttons
            document.querySelectorAll('.nav-btn').forEach(btn => {
                btn.classList.remove('active', 'text-donezo-light');
                btn.classList.add('text-gray-400');
                if (btn.getAttribute('onclick').includes(`'${viewName}'`)) {
                    btn.classList.remove('text-gray-400');
                    btn.classList.add('active', 'text-donezo-light');
                }
            });

            if (viewName === 'home') {
                closeFullScreen();
                return;
            }

            const fsView = document.getElementById('full-screen-view');
            const fsTitle = document.getElementById('fs-title');
            const fsContent = document.getElementById('fs-content');

            fsView.classList.remove('hidden');
            setTimeout(() => fsView.classList.remove('translate-y-full'), 10); // trigger transition

            if (viewName === 'wallet') {
                fsTitle.innerText = "Wallet";
                fsContent.innerHTML = '<p class="text-center text-gray-500 py-10">Loading wallet...</p>';
                loadWalletHistory(fsContent);
            } else if (viewName === 'history' || viewName === 'deliveries') {
                fsTitle.innerText = viewName === 'history' ? "Past History" : "Deliveries";
                fsContent.innerHTML = '<p class="text-center text-gray-500 py-10">Loading...</p>';
                loadPastOrders(fsContent);
            } else if (viewName === 'profile') {
                fsTitle.innerText = "Profile";
                const picHtml = userData && userData.profile_pic
                    ? `<img src="${userData.profile_pic}" class="w-20 h-20 rounded-full mx-auto mb-3 object-cover border-4 border-donezo-light shadow-lg">`
                    : `<div class="w-20 h-20 bg-gradient-to-br from-donezo-light to-donezo-dark rounded-full mx-auto mb-3 flex items-center justify-center text-white text-2xl font-black">${userData ? (userData.full_name || userData.username || 'R').charAt(0).toUpperCase() : 'R'}</div>`;
                fsContent.innerHTML = `
                    <div class="text-center py-6 border-b border-gray-100">
                        ${picHtml}
                        <h3 class="text-lg font-bold">${userData ? (userData.full_name || userData.username) : 'Rider'}</h3>
                        <p class="text-sm text-gray-500">@${userData ? userData.username : '---'} &bull; ID: ${userData ? userData.id : '---'}</p>
                    </div>
                    <div class="py-6 space-y-3">
                        <button class="w-full py-3 bg-gray-100 text-gray-700 font-semibold rounded-xl hover:bg-gray-200 transition" onclick="switchView('wallet')">&#128179; View Wallet</button>
                        <button class="w-full py-3 bg-gray-100 text-gray-700 font-semibold rounded-xl hover:bg-gray-200 transition" onclick="switchView('history')">&#128203; Delivery History</button>
                        <button class="w-full py-3 bg-red-50 text-red-600 font-bold rounded-xl hover:bg-red-100 transition" onclick="localStorage.removeItem('riderUser'); window.location.href='/rider.html'">Logout</button>
                        <hr class="border-gray-100">
                        <button class="w-full py-3 bg-red-600 text-white font-bold rounded-xl hover:bg-red-700 transition shadow-md" onclick="deleteRiderAccount()">&#128465; Delete My Account</button>
                    </div>
                `;
            }
        }

        function closeFullScreen() {
            const fsView = document.getElementById('full-screen-view');
            fsView.classList.add('translate-y-full');
            setTimeout(() => fsView.classList.add('hidden'), 300);

            // re-activate home nav
            document.querySelectorAll('.nav-btn').forEach(btn => {
                btn.classList.remove('active', 'text-donezo-light');
                btn.classList.add('text-gray-400');
                if (btn.getAttribute('onclick').includes(`'home'`)) {
                    btn.classList.remove('text-gray-400');
                    btn.classList.add('active', 'text-donezo-light');
                }
            });
        }

        // (reusing existing fetch logic but rendering inside full screen view)
        async function loadWalletHistory(container) {
            if (!userData || !userData.id) return;
            try {
                const [ordersRes, payoutsRes] = await Promise.all([
                    fetch(`/api/riders/${userData.id}/history`),
                    fetch(`/api/riders/${userData.id}/payouts`)
                ]);
                const orders = await ordersRes.json();
                const payouts = await payoutsRes.json();

                let currentBal = 0;
                let transactions = [];

                orders.forEach(o => {
                    if (o.status === 'DELIVERED' && o.riderPayout) {
                        currentBal += o.riderPayout;
                        transactions.push({ type: 'credit', amount: o.riderPayout, desc: 'Order #' + o.id, date: new Date(o.completedAt || o.createdAt) });
                    }
                });
                payouts.forEach(p => {
                    currentBal -= p.amount_paid;
                    transactions.push({ type: 'debit', amount: p.amount_paid, desc: 'Balance Disbursed', date: new Date(p.paid_at) });
                });

                transactions.sort((a, b) => b.date - a.date);

                let html = `
                    <div class="bg-gradient-to-br from-[#146b42] to-[#0f4d30] rounded-3xl p-6 shadow-lg mb-8 text-center text-white">
                        <p class="text-sm font-medium opacity-80 mb-1">Current Unpaid Balance</p>
                        <h1 class="text-4xl font-black">$${Math.max(0, currentBal).toFixed(2)}</h1>
                    </div>
                    <h3 class="font-bold text-gray-900 mb-4">Transaction Activity</h3>
                    <div class="space-y-3 pb-8">
                `;

                if (transactions.length === 0) {
                    html += '<p class="text-sm text-gray-500 text-center py-4">No activity yet.</p>';
                } else {
                    transactions.forEach(t => {
                        const timeStr = t.date.toLocaleString(undefined, { month: 'short', day: 'numeric', hour: '2-digit', minute: '2-digit' });
                        if (t.type === 'credit') {
                            html += `<div class="flex items-center justify-between p-4 bg-green-50 rounded-xl border border-green-100"><div class="flex items-center gap-3"><div class="w-8 h-8 rounded-full bg-green-200 text-green-700 flex items-center justify-center font-bold">+</div><div><p class="font-semibold text-gray-900">${t.desc}</p><p class="text-xs text-gray-500">${timeStr}</p></div></div><span class="font-bold text-green-600">+$${t.amount.toFixed(2)}</span></div>`;
                        } else {
                            html += `<div class="flex items-center justify-between p-4 bg-red-50 rounded-xl border border-red-100"><div class="flex items-center gap-3"><div class="w-8 h-8 rounded-full bg-red-200 text-red-700 flex items-center justify-center font-bold">-</div><div><p class="font-semibold text-gray-900">${t.desc}</p><p class="text-xs text-gray-500">${timeStr}</p></div></div><span class="font-bold text-red-600">-$${t.amount.toFixed(2)}</span></div>`;
                        }
                    });
                }
                html += '</div>';
                container.innerHTML = html;
            } catch (e) { container.innerHTML = '<p class="text-red-500 text-center">Failed to load.</p>'; }
        }

        async function loadPastOrders(container) {
            if (!userData || !userData.id) return;
            try {
                const res = await fetch(`/api/riders/${userData.id}/history`);
                const orders = await res.json();

                if (orders.length === 0) {
                    container.innerHTML = '<p class="text-center text-gray-400 text-sm mt-8">No past orders.</p>';
                    return;
                }

                let html = '<div class="space-y-4 pb-8">';
                orders.forEach(o => {
                    const date = new Date(o.completedAt || o.createdAt).toLocaleString(undefined, { month: 'short', day: 'numeric', hour: '2-digit', minute: '2-digit' });
                    const badge = o.status === 'DELIVERED'
                        ? '<span class="px-2 py-0.5 rounded text-[10px] font-bold bg-green-100 text-green-600 uppercase">Success</span>'
                        : '<span class="px-2 py-0.5 rounded text-[10px] font-bold bg-red-100 text-red-600 uppercase">Failed</span>';

                    html += `
                        <div class="bg-white rounded-xl p-4 border border-gray-100 shadow-sm">
                            <div class="flex justify-between items-start mb-2">
                                <h4 class="font-bold text-gray-900 text-sm truncate max-w-[200px]">${o.deliveryAddress || 'Address unavailable'}</h4>
                                ${badge}
                            </div>
                            <p class="text-xs text-gray-500 mb-3">${o.status === 'DELIVERED' ? 'Delivered' : 'Cancelled'} on ${date}</p>
                            <div class="flex justify-between text-sm items-center">
                                <span class="font-semibold text-gray-600">Order #${o.id}</span>
                                <span class="font-bold text-donezo-light">$${o.riderPayout ? o.riderPayout.toFixed(2) : '0.00'}</span>
                            </div>
                        </div>
                    `;
                });
                html += '</div>';
                container.innerHTML = html;
            } catch (e) { container.innerHTML = '<p class="text-red-500 text-center">Failed to load.</p>'; }
        }

        // --- online/offline toggle 
        async function updateOnlineStatus(isOnline) {
            if (!userData || !userData.id) return;
            try {
                await fetch('/api/riders/' + userData.id + '/online', {
                    method: 'PUT',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ isOnline: isOnline })
                });
            } catch (e) { }
        }

        const toggleDesktop = document.getElementById('toggle-desktop');
        const statusTextDesktop = document.getElementById('status-text-desktop');

        function handleToggle(isChecked) {
            // sync both
            toggle.checked = isChecked;
            if (toggleDesktop) toggleDesktop.checked = isChecked;

            if (isChecked) {
                statusText.innerText = 'Online';
                if (statusTextDesktop) statusTextDesktop.innerText = 'Online';
                updateOnlineStatus(true);
            } else {
                statusText.innerText = 'Offline';
                if (statusTextDesktop) statusTextDesktop.innerText = 'Offline';
                updateOnlineStatus(false);
                if (currentState === 'OFFER') currentState = 'IDLE'; // cancel offer if go offline
            }
            renderState();
        }

        toggle.addEventListener('change', (e) => handleToggle(e.target.checked));
        if (toggleDesktop) {
            toggleDesktop.addEventListener('change', (e) => handleToggle(e.target.checked));
        }

        // utilities
        function showToast(msg) {
            const toast = document.getElementById('toast');
            document.getElementById('toast-msg').innerText = msg;
            toast.classList.remove('translate-x-[150%]', 'opacity-0');
            setTimeout(dismissToast, 6000);
        }

        function dismissToast() {
            document.getElementById('toast').classList.add('translate-x-[150%]', 'opacity-0');
        }

        // init
        window.onload = () => {
            initMap();
            renderState();

            // start polling
            pollInterval = setInterval(() => {
                if (toggle.checked) {
                    fetchDeliveries();
                }
            }, 5000);

            // immediate check
            if (toggle.checked) fetchDeliveries();
        };

    </script>
<script src="/auth.js"></script>
</body>
