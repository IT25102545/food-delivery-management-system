<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Rider Portal - Zestro</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <style>
        body { font-family: 'Inter', sans-serif; background-color: #f8fafc; }
    </style>
    <link rel="stylesheet" href="/modern-animations.css">
</head>
<body class="pb-20">

    <!-- header -->
    <header class="bg-green-600 text-white p-4 shadow-md sticky top-0 z-10 flex justify-between items-center">
        <h1 class="text-xl font-bold">Rider App</h1>
        <a href="/rider.html" class="text-green-100 hover:text-white text-sm">Logout</a>
    </header>

    <!-- content -->
    <main class="p-4 max-w-lg mx-auto">
        <h2 class="text-gray-700 font-semibold mb-4">Active Deliveries</h2>
        
        <div id="orders-container" class="space-y-4">
            <!-- orders dynamic -->
        </div>
    </main>

    <script>
        async function fetchOrders() {
            const res = await fetch('/api/orders');
            const orders = await res.json();
            const container = document.getElementById('orders-container');
            container.innerHTML = '';
            
            if (orders.length === 0) {
                container.innerHTML = '<p class="text-gray-500 text-center py-8">No active orders found.</p>';
            }

            orders.forEach(order => {
                const statusColor = order.status === 'DELIVERED' ? 'bg-gray-100 text-gray-500' : 'bg-white shadow-sm border border-gray-200';
                const buttonHtml = order.status !== 'DELIVERED' 
                    ? `<button onclick="updateStatus(${order.id}, 'DELIVERED')" class="w-full mt-3 bg-green-500 text-white py-2 rounded-lg font-medium hover:bg-green-600">Mark Delivered</button>`
                    : `<div class="w-full mt-3 text-center text-green-600 font-medium py-2">✓ Delivered</div>`;

                container.innerHTML += `
                    <div class="${statusColor} rounded-xl p-4">
                        <div class="flex justify-between items-start mb-2">
                            <div>
                                <span class="text-xs font-bold text-gray-400 uppercase">Order #${order.id}</span>
                                <h3 class="font-bold text-gray-800">${order.customerName}</h3>
                            </div>
                            <span class="text-lg font-bold text-gray-800">$${order.totalAmount.toFixed(2)}</span>
                        </div>
                        <div class="text-sm text-gray-600 mb-2">
                            Status: <span class="font-semibold">${order.status}</span>
                        </div>
                        ${buttonHtml}
                    </div>
                `;
            });
        }

        async function updateStatus(id, newStatus) {
            await fetch(`/api/orders/${id}/status`, {
                method: 'PUT',
                headers: { 'Content-Type': 'application/json' },
                body: JSON.stringify({ status: newStatus })
            });
            fetchOrders();
        }

        async function initDashboard() {
            const riderStr = localStorage.getItem('riderUser');
            if (!riderStr) {
                window.location.href = '/rider-login.html';
                return;
            }
            const rider = JSON.parse(riderStr);
            
            try {
                const res = await fetch('/api/users/status?username=' + encodeURIComponent(rider.username));
                if (res.ok) {
                    const data = await res.json();
                    if (data.status === 'SUSPENDED') {
                        document.querySelector('main').innerHTML = `
                            <div class="bg-red-50 text-red-700 p-8 rounded-2xl text-center border border-red-200 mt-10 shadow-sm">
                                <svg class="w-16 h-16 mx-auto mb-4 text-red-500" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M12 8v4m0 4h.01M21 12a9 9 0 11-18 0 9 9 0 0118 0z"/></svg>
                                <h2 class="text-2xl font-bold mb-2">Account Suspended</h2>
                                <p class="text-red-600 leading-relaxed font-medium">Your rider account has been suspended by the administration.<br>You cannot perform deliveries at this time.<br><br>Please contact the support team for assistance.</p>
                            </div>
                        `;
                        return;
                    }
                }
            } catch (e) {}

            fetchOrders();
        }

        // initialize
        initDashboard();
    </script>
    <script src="/modern-animations.js"></script>
<script src="/auth.js"></script>
</body>
</html>
